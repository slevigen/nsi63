          : ``);
    }
    // litra i første ledige kvadrant (aldri oppå et sporbånd)
    const opptatt = vKvad[litra] || new Set();
    const q = [[-1, 1], [1, 1], [-1, -1], [1, -1]]
      .find(([qx, qy]) => !opptatt.has(qx + "," + qy)) || [1, 1];
    s += `<g class="plklikk" onclick="plVeksel('${litra}')">` +
      `<circle cx="${px}" cy="${py}" r="16" fill="transparent"/>` +
      lamper +
      `<text class="pltekst"${q[0] > 0 ? "" : ' text-anchor="end"'} ` +
      `x="${px + q[0] * 6}" y="${py + (q[1] > 0 ? 20 : -14)}">` +
      `${litra}</text></g>`;
  }
  if (togspor.length > 2)
    s += `<text class="pltekst" x="8" y="14">NB: flere togspor enn to
      i tabellen — bare de to første rades automatisk</text>`;
  /* ---- overlegg (som før, forenklet forankring) ---- */
  const varsel = fns.filter(f => f.type === "sporfelt" &&
                                 f.rolle === "varselfelt");
  // Varselfeltene: KORTE felt ute på linja (men ikke helt ute i
  // kanten) — lampa inne på sporbåndet, litra ved siden av, og
  // skille TETT INNTIL lampe og litra på begge sider. Mellom
  // varselfeltet og linjefeltet ligger et ulitrert felt (uten lampe
  // og litra); forsignalene står i det, innenfor varselfeltet.
  for (const vf of varsel) {
    const side = (feltAv[vf.linjefelt] || {}).side;
    if (!side) continue;
    const base = side === "v" ? X(0) : nCol * MW;
    const d = side === "v" ? 1 : -1;      // +1 = innover mot øst
    const px = base - d * 150;
    s += `<circle id="pl-vfl-${vf.id}" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${px}" cy="${Y(0)}" r="6"/>` +
      // litra UTENFOR båndet, sentrert over lampa
      `<text class="pltekst" text-anchor="middle" x="${px}" ` +
      `y="${Y(0) - 12}">${vn(vf)}</text>` +
      skille(px - d * 14) + skille(px + d * 14);
  }
  const sigKl = f => (K.hal.signaltyper[f.type] || {}).klasse ||
    (String(f.type).startsWith("hovedsignal") ? "hovedsignal"
     : String(f.type).startsWith("forsignal") ? "forsignal" : null);
  // SIGNALSIDEN: alltid HØYRE side sett fra kjøreretningen signalet
  // vender mot. Med nord opp: signaler som ses av VESTGÅENDE tog
  // (vender øst — innkjør fra h-enden, utkjør mot v-enden) står OVER
  // sporet; signaler som ses av ØSTGÅENDE (innkjør fra v, utkjør mot
  // h) står UNDER. Skiftesignalet følger utkjørsignalet det står
  // forbi. Frittstående forsignal lengst ute; montert forsignal
  // stables utover på vertens mast.
  // Lampene ligger tett på sporbåndet (bånd 12 + linse 12 + luft),
  // litraen på UTSIDEN av lamperekka
  // Avstanden fra sporbåndet til signalrammen = rammens egen høyde
  // (22): båndkant Y±6 + 22 + halv ramme 11 => senter i Y ∓ 39
  // (justert 21.08.2026: 39 -> 33 — litt tettere på båndet)
  const yOver = Y(0) - 33;
  const yUnder = Y(0) + 33;
  const sigOver = (rolle, side) =>
    rolle === "innkjor" ? side === "h" : side === "v";
  // MASTKOMPOSITOREN. Den fysiske masten er loddrett; på sporplanen
  // tegnes den rotert 90° som ÉN vannrett lamperekke: mastefoten mot
  // enden signalet VENDER (over sporet = vender øst = fot til høyre;
  // under = fot til venstre), toppen ytterst. Verten (hovedsignalet)
  // øverst, påmonterte signaler (forsignal, høyt skiftesignal) følger
  // nedover mot foten — «loddrett under» blir dermed «innover i
  // rekka». Ingen mastestrek; slukket linse er hvit med omriss.
  // Lamperekkefølge topp->bunn per del: hovedsignal 3-lys grønn-rød-
  // grønn, 2-lys rød-grønn; forsignal gul-grønn; skiftesignal 41-42.
  const master = {};   // vert-litra -> {px, py, over, deler: [...]}
  const oppTatt = [];  // tegnede masters utstrekning (kollisjonssjekk
                       // for den sorte trykknappen)
  // Hver lampe får eget id, og `cfg` oversetter TEGNET posisjon
  // (topp->bunn i kapselen) til konfigtabellens lampeindeks — samme
  // indeks som master driver de fysiske linsene med. Signalbildene
  // (hvilke lamper som lyser/blinker per bilde) leses dermed RETT UT
  // av signaltyper-tabellen i konfig, ikke av panelets egne regler.
  const delFor = f => {
    const kl = sigKl(f) ||
      (String(f.type).startsWith("skiftesignal") ? "skiftesignal" : null);
    const nLys = (K.hal.signaltyper[f.type] || {}).lamper || 2;
    const ider = n => Array.from({ length: n },
      (_, i) => `pl-s-${kl}-${f.id}-${i}`);
    // Fargene kommer fra ui/signalfarger.js, i KONFIGrekkefølge.
    // cfg oversetter tegnet posisjon (topp->bunn) til konfigindeks, og
    // fargelista bygges av den — så tabellen er eneste kilde og kan
    // ikke komme i utakt med kablingsvisningen.
    const fargerFra = cfg => cfg.map(i => signalLampeFarge(f.type, i));
    if (kl === "hovedsignal") {
      // 3-lys tegnes grønn-rød-grønn (= konfigindeks 0,1,2);
      // 2-lys tegnes rød-grønn, men konfig har [grønn, rød] -> [1,0]
      const cfg = nLys >= 3 ? [0, 1, 2] : [1, 0];
      return { navn: vn(f), farger: fargerFra(cfg), cfg, ider: ider(cfg.length) };
    }
    if (kl === "forsignal")
      // gul-grønn = konfigindeks 0,1
      return { navn: vn(f), farger: fargerFra([0, 1]),
               cfg: [0, 1], ider: ider(2) };
    // Høyt skiftesignal: bildene er STREKER, ikke runde linser —
    // 41 loddrett, 42 skrå (se dokumentasjonen) — og de lyser GULT.
    // Konfig har [42-lampa, 41-lampa]; tegnet 41,42 -> [1,0].
    // Ettlys-typen har bare 42-streken.
    if (nLys === 1)
      return { navn: vn(f), farger: fargerFra([0]), former: ["strek42"],
               cfg: [0], ider: ider(1) };
    // rekkefølge i kapselen: skrå (42) først, så loddrett (41)
    return { navn: vn(f), farger: fargerFra([0, 1]),
             former: ["strek42", "strek41"],
             cfg: [0, 1], ider: ider(2) };
  };
  for (const f of fns) {
    const side = f.linjefelt ? (feltAv[f.linjefelt] || {}).side : null;
    if (sigKl(f) !== "hovedsignal" || !side) continue;
    const inn = f.rolle === "innkjor";
    const over = sigOver(f.rolle, side);
    // utkjørsignalet er FELLES for togsporene og står der de er
    // flettet: utenfor halsvekselen, mot linjefeltet
    const px = side === "h" ? (inn ? X(nCol - 1) + 16 : X(cH) + 60)
                            : (inn ? X(0) + 16 : X(cV) - 70);
    master[f.id] = { px, py: over ? yOver : yUnder, over,
                     deler: [delFor(f)] };
    if (!inn) {
      // EGET utkjørsignal per togspor (Grindvoll-mønsteret): står
      // ved SITT spor — foten i sporets bandende mot linja, masten
      // på UTSIDEN av raden (over for nordlige rader), og vender
      // mot linja den fører til. Utledes av togveitabellen.
      const t2 = tvs.find(t => t.start === f.id && t.spor);
      const sr = t2 ? rowOf[t2.spor] : undefined;
      if (t2 && sr !== undefined && sr !== 0 && sporKnute[t2.spor]) {
        const xs = sporKnute[t2.spor].map(p => p.x);
        master[f.id].fotX = X(side === "v" ? Math.min(...xs)
                                           : Math.max(...xs));
        // kapselen ligger TETT PÅ sitt eget spors bånd (stripa
        // mellom radene er trang), litraen på motsatt side av
        // kapselen — inn i resten av stripa
        master[f.id].py = sr >= 0 ? Y(sr) - 20 : Y(sr) + 20;
        master[f.id].over = side === "v";     // orientering (fotside)
        master[f.id].tekstOver = sr >= 0;
      } else {
        // FELLES utkjørsignal (Sokna-mønsteret): foten der
        // linjefeltet starter sett fra stasjonen (det indre skillet
        // mot vekselfeltet — tunge/grein-avstanden fra halsvekselen)
        master[f.id].fotX = side === "h"
          ? X(cH) + skAvst(hals.h || "", false)
          : X(cV) - skAvst(hals.v || "", true);
      }
    } else {
      // Innkjørsignalmastens FOT skal i x ligge der linjefeltet
      // STARTER (det ytre skillet, kant∓LFUT/LFUTB)
      master[f.id].fotX = side === "h"
        ? nCol * MW + lfUtFor((lfH || {}).id)
        : X(0) - lfUtFor((lfV || {}).id);
    }
  }
  for (const f of fns) {   // påmonterte og frittstående forsignaler
    if (sigKl(f) !== "forsignal") continue;
    if (f.montert_med && master[f.montert_med]) {
      master[f.montert_med].deler.push(delFor(f));
      continue;
    }
    const vert = fns.find(x => x.id === f.varsler_om &&
                               sigKl(x) === "hovedsignal");
    const side = vert && vert.linjefelt
      ? (feltAv[vert.linjefelt] || {}).side : null;
    if (!side) continue;
    const over = sigOver("innkjor", side);
    // frittstående forsignal: ytterst av signalene — i det ulitrerte
    // feltet innenfor varselfeltet, eller (uten varselfelt) rett
    // utenfor linjefeltets ytre skille. Avstanden følger skillet.
    const fsUt = lfUtFor(vert.linjefelt);
    master[`fs-${f.id}`] = {
      px: side === "h" ? nCol * MW + fsUt + 27 : X(0) - fsUt - 42,
      py: over ? yOver : yUnder, over, deler: [delFor(f)] };
  }
  for (const f of fns.filter(x => String(x.type).startsWith("skiftesignal"))) {
    if (f.montert_med && master[f.montert_med]) {
      master[f.montert_med].deler.push(delFor(f));
      continue;
    }
    const forsteV = (f.skift_sporveksler || [])[0];
    const inf = forsteV && bruk[forsteV];
    const side = inf && ((inf.avvik && inf.avvik.side) ||
                         (inf.normal && inf.normal.side));
    if (!side) continue;
    // frittstående skiftesignal på EGEN mast: står ved den første
    // vekselen det gjelder for — utenfor den mot sin ende, på samme
    // side av sporet som skiftebevegelsen ses fra (v = over,
    // h = under), relativt til VEKSELENS egen rad
    const over = side === "v";
    const fv = vx[forsteV];
    const vrad = fv && fv.pos ? fv.pos.rad : 0;
    const vX = fv && fv.pos ? X(fv.pos.x)
                            : (side === "h" ? X(cH) : X(cV));
    master[`sk-${f.id}`] = {
      // langt nok ut til å gå klar av utkjørmasten ved samme veksel
      px: side === "v" ? vX - 150 : vX + 120,
      py: over ? Y(vrad) - 33 : Y(vrad) + 33,
      over, deler: [delFor(f)] };
  }
  for (const m of Object.values(master)) {
    // fot mot enden masten vender: over = øst (høyre), under = vest.
    // Topp->bunn tegnes MOT foten; delene i rekkefølge vert først.
    const flat = [];
    for (const d of m.deler)
      d.farger.forEach((farge, i) =>
        flat.push({ farge, id: d.ider[i],
                    form: d.former && d.former[i] }));
    const dir = m.over ? 1 : -1;   // topp først: øst-fot = venstre topp
    const n = flat.length;
    if (m.fotX !== undefined) {
      // foten (tappenden av kapselen) ankres i vekselpunktet
      m.px = m.over ? m.fotX - ((n - 1) * 15 + 19) : m.fotX + 19;
    }
    let deltekst = "", lamper = "";
    // HUSET: én avrundet kapsel rundt ALLE lampene på masten (som
    // kunstverket), med mastefot-tapp i fotenden. Tegnes under
    // lampene; litraen ligger utenfor kapselen.
    const alleX = flat.map((_, i) =>
      m.px + (m.over ? i : n - 1 - i) * 15);
    const hx0 = Math.min(...alleX) - 11, hx1 = Math.max(...alleX) + 11;
    oppTatt.push({ x0: hx0 - 9, x1: hx1 + 9, y: m.py });
    const fotHoyre = m.over;   // vender øst = fot mot høyre
    const tapp = fotHoyre
      ? `<rect x="${hx1 - 1}" y="${m.py - 5}" width="8" height="10" ` +
        `fill="#8d9094" stroke="#33363a" stroke-width="1"/>` +
        `<path d="M${hx1 + 7},${m.py - 9} v18" stroke="#33363a" ` +
        `stroke-width="1.5" fill="none"/>`
      : `<rect x="${hx0 - 7}" y="${m.py - 5}" width="8" height="10" ` +
        `fill="#8d9094" stroke="#33363a" stroke-width="1"/>` +
        `<path d="M${hx0 - 7},${m.py - 9} v18" stroke="#33363a" ` +
        `stroke-width="1.5" fill="none"/>`;
    // skiftesignal på EGEN mast har RETTE hjørner; hovedsignalmaster
    // (og master med blandet innhold) beholder kapselformen
    const bareSkift = m.deler.every(d => d.former);
    const hus = `<rect x="${hx0}" y="${m.py - 11}" ` +
      `width="${hx1 - hx0}" height="22" rx="${bareSkift ? 0 : 10}" ` +
      `fill="#8d9094" stroke="#33363a" stroke-width="1"/>` + tapp;
    flat.forEach((l, i) => {
      if (!l) return;
      const cx = m.px + (m.over ? i : n - 1 - i) * 15;
      let c;
      if (l.form) {
        // Høyt skiftesignal: strekbildene 41 (loddrett) og 42 (skrå)
        // — masker over runde linser, aldri lengre enn lampediameteren
        const rot = l.form === "strek42"
          ? ` transform="rotate(-45 ${cx} ${m.py})"` : "";
        c = `<rect${l.id ? ` id="${l.id}"` : ""} class="pl" ` +
          `style="${lampeStil(l.farge)}" x="${cx - 2}" y="${m.py - 6}" ` +
          `width="4" height="12" rx="1.5"${rot}/>`;
      } else {
        c = `<circle${l.id ? ` id="${l.id}"` : ""} class="pl"` +
          ` style="${lampeStil(l.farge)}" cx="${cx}" cy="${m.py}" r="6"/>`;
      }
      lamper += c;
    });
    // navnene: ett per del, SENTRERT over delens egne lamper
    let li = 0;
    for (const d of m.deler) {
      const i2 = li + d.farger.length - 1;
      const x1 = m.px + (m.over ? li : n - 1 - li) * 15;
      const x2 = m.px + (m.over ? i2 : n - 1 - i2) * 15;
      const ty = (m.tekstOver !== undefined ? m.tekstOver : m.over)
        ? m.py - 14 : m.py + 24;                   // alltid utsiden
      deltekst += `<text class="pltekst" text-anchor="middle" ` +
        `x="${(x1 + x2) / 2}" y="${ty}">${d.navn}</text>`;
      li += d.farger.length;
    }
    s += `<g>${hus}${lamper}${deltekst}</g>`;
  }
  // BLÅ TOGVEILAMPE + SORT TRYKKNAPP: i kolonne rett under stilleren
  // (fasit fra apparatet: lampe på +33, knapp på +56). Står en mast i
  // veien (Grindvoll: ZL ved linjefeltet), flyttes hele kolonnen
  // sidelengs i 13 px-steg til nærmeste frie plass, mot stasjonen
  // først. Knappen sløyfes på linjefelt MED linjeblokk uten
  // varselfelt (fjernstyrt strekning: ingen varselklokke å kvittere
  // og ingen sistevognskontroll — Ktp hører til blokklampa, senere).
  for (const k of knapper) {
    const ly = Y(0) + 33, ky = Y(0) + 56;
    const medKnapp = (PLK[k.lf].vf.length > 0) || !k.linjeblokk;
    const ledig = x => !oppTatt.some(m2 =>
      m2.y > Y(0) + 12 && m2.y < Y(0) + 70 &&
      x + 9 > m2.x0 && x - 9 < m2.x1);
    const lo = Math.min(k.o, k.i) + 10, hi = Math.max(k.o, k.i) - 10;
    const inne = x => x >= lo && x <= hi;
    let kx = k.xm;
    if (!ledig(kx)) {
      const dInn = k.i > k.o ? 1 : -1;      // mot stasjonen
      for (let steg = 13; steg < 400; steg += 13) {
        const a = k.xm + dInn * steg, b2 = k.xm - dInn * steg;
        if (inne(a) && ledig(a)) { kx = a; break; }
        if (inne(b2) && ledig(b2)) { kx = b2; break; }
        if (!inne(a) && !inne(b2)) break;   // ingen fri plass: xm
      }
    }
    s += `<circle id="pl-tv-${k.lf}" class="pl" style="${lampeStil('#1f8fff')}" ` +
      `cx="${kx}" cy="${ly}" r="6"/>`;
    if (medKnapp)
      s += `<g class="plknapp" id="pl-kn-${k.lf}" ` +
        `onclick="plKnapp('${k.lf}')">` +
        `<rect x="${kx - 12}" y="${ky - 12}" width="24" height="24" ` +
        `fill="transparent"/>` +
        `<circle class="knhode" cx="${kx}" cy="${ky}" r="${BSKNAPP}"/></g>`;
  }
  /* sperrene: på sporet/forbindelsen de ligger i */
  const sperrer = fns.filter(f => f.type === "sporsperre");
  const sperrePos = {};
  for (const sp of sperrer) {
    const li = ref(sp.ligger_i);
    let p = null;
    if (li && li.spor && sporKnute[li.spor]) {
      // 40 px INN på båndet fra første koblingspunkt (mot den andre
      // enden) — utenfor båndet ligger bare diagonaler og luft
      const rad = rowOf[li.spor];
      const pkt = sporKnute[li.spor][0];
      const xs = sporKnute[li.spor].map(p2 => p2.x);
      const innover = pkt.x <= Math.min(...xs) ? 1 : -1;
      p = { x: X(pkt.x) + innover * 40, y: Y(rad) };
    } else if (li && li.veksel && vx[li.veksel] && vx[li.veksel].pos) {
      // «veksel N»: sperren tegnes over båndet NÆR vekselen den er
      // knytta til — 48 px ut fra vekselpunktet langs forbindelsen
      // slik den faktisk tegnes (45°-del + ev. vannrett innløp).
      // 48 klarerer tungekontrollampa på greina (26 + linse 6 + luft).
      // Stammeforbindelsen foretrekkes; ellers vekselens egen kant.
      // (Sokna: Sp.II på 3-7-forbindelsen nær veksel 3 — den sperrer
      // både spor 4 og 5; Sp.III på 9-5-innløpet nær veksel 9.)
      const v = vx[li.veksel];
      const lik = (p1, p2) => p1.rad === p2.rad && p1.x === p2.x;
      const st = v.stamme && v.stamme.veksel && vx[v.stamme.veksel];
      let ke2 = null;
      if (st && st.pos)
        ke2 = kanter.find(k =>
          (lik(k.fra, v.pos) && lik(k.til, st.pos)) ||
          (lik(k.fra, st.pos) && lik(k.til, v.pos)));
      if (!ke2)
        // stamme-relasjonen kan peke ANDRE veien: veksel 9 har
        // stammen MOT 5 — Sp.III ligger på den forbindelsen, målt
        // fra veksel 5
        ke2 = kanter.find(k => {
          const a = posAv[k.fra.rad + "|" + k.fra.x];
          const b = posAv[k.til.rad + "|" + k.til.x];
          const makker = lik(k.fra, v.pos) ? b
                       : lik(k.til, v.pos) ? a : null;
          return makker && vx[makker] && vx[makker].stamme &&
                 vx[makker].stamme.veksel === li.veksel;
        });
      if (!ke2)
        ke2 = kanter.find(k => lik(k.fra, v.pos) || lik(k.til, v.pos));
      if (ke2) {

  const bsSkiltOverCy = 2 * bsCy - bsSkiltCy;   // speilet, over dem
  // Amperemeteret står SENTRERT på panelet, Jord og Sign.stp. ved
  // siden av hverandre OVER det. Stillerne fordeles til venstre og
  // høyre for midten etter hvilken side av transparenten objektet
  // hører til, i rekkefølge fra midten og utover: S-lås, rigel,
  // vekselstiller, lokal frigiving, skiftesignal.
  const bsMidt = W / 2;
  const sideAvX = x => (x < bsMidt ? "v" : "h");
  const bsSkiftSide = f => {
    const m = master[`sk-${f.id}`] ||
              (f.montert_med && master[f.montert_med]);
    return m ? sideAvX(m.px) : "h";
  };
  const bsVekselSide = l =>
    vx[l] && vx[l].pos ? sideAvX(X(vx[l].pos.x)) : "v";
  const bsLaasSide = l => {
    for (const o of l.omfatter || []) {
      if (vx[o] && vx[o].pos) return sideAvX(X(vx[o].pos.x));
      if (sperrePos[o]) return sideAvX(sperrePos[o].x);
    }
    return "v";
  };
  // Rekkefølgen INNENFRA og ut er apparatets egen: samlelås, rigel,
  // Lok-frigivning, vekselstiller, skiftesignal. Den er ikke utledet
  // av noe — den ER oppstillingen, og listen her er kilden.
  const bsSide = side => {
    const ut = [];
    // HVIT stiller for gjennomgangsdrift (ORV 3.3: rett ut = av, 45°
    // ned = på), innerst på venstre side, med hvit kontrollampe over
    if (ggBryter && side === "v")
      ut.push({ slag: "gg", id: "gg", farge: "#ecebe4",
                navn: ggBryter.navn || "Gjennomg.", lampe: "#ffffff" });
    for (const l of laaser)
      if (bsLaasSide(l) === side)
        ut.push({ slag: "samlelaas", id: l.id, farge: "#2b6fc2",
                  navn: l.navn || l.id });
    for (const l of rigler)
      if (bsLaasSide(l) === side)
        ut.push({ slag: "rigel", id: l.id, farge: "#2b6fc2",
                  navn: l.navn || l.id });
    // Ingen lampe over Lok-stilleren: spaken viser selv om enden er
    // frigitt, og forbildets frigivningsmelding er lokalstillerlampen
    // UTE ved vekselen — ikke et lys på apparatet.
    ut.push({ slag: "lok", id: side, farge: "#d8a400",
              navn: side === "v" ? "Lok I" : "Lok II" });
    for (const l of bsVeksL)
      if (bsVekselSide(l) === side)
        ut.push({ slag: "veksel", id: l, farge: "#2b6fc2",
                  navn: l, pluss: true, avvikOpp: VAVVIKOPP[l] !== false });
    for (const f of bsSkiftL)
      if (bsSkiftSide(f) === side)
        ut.push({ slag: "skift", id: f.id, farge: "#c9342a",
                  navn: f.id });
    return ut;
  };
  // Flaten starter der sporplanen slutter — ikke der innholdet gjør.
  //
  // HAMMERLAKK: betjeningsflaten er et fotografi av ekte
  // hammerlakk (ui/hammerlakk.png), lagt som gjentakende mønster.
  //
  // Flisen er gjort SØMLØS ved kryssfading mot motsatt kant — siste
  // rad møter sin egen første — ikke ved speiling. Speiling gir en
  // matematisk perfekt skjøt, men fotoets grovere klumper blir da
  // symmetriske om aksen, og flaten leses som tapet. Kryssfadingen
  // er kompensert for kontrasttap, ellers står overgangsbåndet igjen
  // som en glattere stripe.
  //
  // Flisen tegnes i 133x68 — fila er 266x136, altså nøyaktig dobbelt
  // opp, så kornet holder seg skarpt på tette skjermer. Størrelsen er
  // målt fram, ikke gjettet: kornet skal være under en enhet. Se
  // kilder/lag-hammerlakk.py.
  //
  // Flisa gjentas mange ganger over flaten, og da leses ALT som er
  // grovere enn kornet som mønster i stedet for tilfeldighet — helt
  // ned til en prosents forskjell. Derfor er bildet høypassfiltrert
  // hardt, hver fargekanal for seg, og rad- og kolonnesnittene er
  // tvunget like.
  //
  // Grunnfargen ligger under: skulle bildet mangle, står flaten der i
  // riktig farge, bare uten strukturen.
  // NB: fila skal være nøyaktig 266x136 — dobbelt av dette. Går
  // forholdet ikke opp i to, krymper nettleseren med skjev faktor,
  // og hver flisgrense blir en svak loddrett strek.
  const HLB = 133, HLH = 68;
  s += `<defs><pattern id="hammerlakk" width="${HLB}" height="${HLH}" ` +
    `patternUnits="userSpaceOnUse">` +
    // Målene står i adressen. Bytter flisa størrelse, bytter URL-en,
    // og en nettleser som sitter på den gamle fila kan ikke bruke
    // den. Uten dette passes et bilde med andre mål inn i boksen med
    // preserveAspectRatio, og flaten blir stripete.
    //
    // preserveAspectRatio="none" gjør samme jobben fra andre siden:
    // bildet SKAL fylle flisa, uansett hva det måtte være.
    `<image id="pl-hammerlakk" preserveAspectRatio="none" ` +
    `href="/ui/hammerlakk.png?${HLB}x${HLH}" ` +
    `width="${HLB}" height="${HLH}"/>` +
    `</pattern></defs>` +
    `<rect x="${-kantV}" y="${H}" ` +
    `width="${W + kantV + kantH}" height="${BSH}" fill="${HAMMERGRUNN}"/>` +
    `<rect x="${-kantV}" y="${H}" ` +
    `width="${W + kantV + kantH}" height="${BSH}" ` +
    `fill="url(#hammerlakk)"/>`;
  // Måleren tegnes 46 px bred; høyden følger av tegningens format.
  const ampMaaler = (cx, cy, br) => {
    const k = br / AMPB, h = AMPH * k;
    const bane = (d, fr) => `<path d="${d}" class="ampsort"` +
      (fr === "nonzero" ? ` fill-rule="nonzero"` : "") + `/>`;
    return `<g transform="translate(${(cx - br / 2).toFixed(2)},` +
      `${(cy - h / 2).toFixed(2)}) scale(${k.toFixed(6)})">` +
      `<rect x="${AMPRAMME[0]}" y="${AMPRAMME[1]}" ` +
      `width="${AMPRAMME[2]}" height="${AMPRAMME[3]}" ` +
      `rx="${AMPRAMME[4]}" class="ampskive"/>` +
      bane(AMPBOYLE) +
      AMPMERKE.map(m => bane(m[0], m[1])).join("") +
      `<text x="${AMPTEKST[1]}" y="${AMPTEKST[2]}" ` +
      `font-size="${AMPTEKST[3]}" class="amptekst">${AMPTEKST[0]}</text>` +
      `<g transform="translate(${AMPPIV[0]},${AMPPIV[1]})">` +
      `<g id="pl-amp"><path d="${AMPVISER}" class="ampsort"/></g></g>` +
      `</g>`;
  };
  const bsTegn = (it, cx) => {
    if (it.lampe)
      s += `<circle id="bs-la-${it.slag}" class="pl" ` +
        `style="${lampeStil(it.lampe)}" cx="${cx}" ` +
        `cy="${bsCy - BSUTSLAG - BSKNOTT - 14}" r="6"/>`;
    s += `<g class="bs">` +
      // Vekselstilleren har ETT skilt per stilling: litra over «−»
      // for avvik øverst, litra over «+» for normal nederst — samme
      // vei som stilleren beveges. Løse ±-tegn ved spaken sier ikke
      // hvilken veksel de gjelder.
      // Øverst står stillingen stilleren legges OPP til, og hvilken
      // det er avgjøres av sporplanen: ligger avviket oppover der,
      // ligger det oppover her.
      (it.pluss
        ? bsSkilt(cx, bsSkiltOverCy, BSSKILT, BSSKILT,
                  [it.navn, it.avvikOpp ? "\u2212" : "+"])
        : "") +
      // Sporet viser hvor stilleren KAN gå. De fleste kan bare legges
      // 45° ned fra normalstilling, og da går sporet bare ned — et
      // spor som også peker oppover lover en bevegelse som ikke
      // finnes. Vekselstilleren (it.pluss) er den ene som kan begge
      // veier.
      //
      bsSpor(cx, bsCy, false) +
      // Tegnes i NORMALSTILLING: rett ut, altså midt i sporet.
      // bsSett legger den ned når objektet er aktivert.
      `<circle id="bs-kn-${it.slag}-${it.id}" class="bskn" ` +
      `cx="${cx}" cy="${bsCy}" r="${BSKNOTT}" fill="${it.farge}" ` +
      `stroke="#33363a" stroke-width="1" pointer-events="none"/>` +
      `<rect x="${cx - 15}" y="${bsCy - 26}" width="30" height="26" ` +
      `fill="transparent" ` +
      `onclick="bsDytt('${it.slag}','${it.id}','opp')"/>` +
      `<rect x="${cx - 15}" y="${bsCy}" width="30" height="26" ` +
      `fill="transparent" ` +
      `onclick="bsDytt('${it.slag}','${it.id}','ned')"/>` +
      // Nedre skilt står i samme høyde for ALLE stillerne, så platene
      // danner en rad tvers over apparatet.
      bsSkilt(cx, bsSkiltCy, BSSKILT, BSSKILT,
              it.pluss ? [it.navn, it.avvikOpp ? "+" : "\u2212"]
                       : it.navn) + `</g>`;
  };
  // midtgruppen: kontrollampe (signalstopp/jordfeil) øverst, Jord og
  // Sign.stp. ved siden av hverandre, amperemeteret under
  // Midtkolonnen er trang: lampe, knapperad med skilt, måler og
  // skilt under.
  //
  // Jord, kontrollampa og Sign.stp står på ÉN linje nesten helt
  // øverst på flaten: trykknappene ytterst og den felles
  // kontrollampa (signalstopp/jordfeil) mellom dem. Over dem er det
  // ingenting, så raden kan ligge høyt uten å komme i veien for
  // skiltene over stillerne.
  //
  // Amperemeteret står sentrert under, i midtkolonnen. Den er
  // BSMIDTLUFT bred til hver side, og der begynner rasteret — så
  // måleren har (BSMIDTLUFT - AMPBREDDE/2) å gå på i hver ende.
  // Blir den bredere enn kolonnen, må BSMIDTLUFT opp; rasteret
  // flytter seg da utover av seg selv.
  const AMPBREDDE = 130;
  const knCy = H + 26, ampCy = bsY0 + 104;
  const knDx = AMPBREDDE / 2 - BSKNAPP;      // fra midten ut til knappen
  s += `<circle id="bs-la-stopp" class="pl" style="${lampeStil('#ff2a1e')}" ` +
    `cx="${bsMidt}" cy="${knCy}" r="6"/>` +
    // Jord og Sign.stp er knapper, ikke stillere: de står utenfor
    // spakrasteret og får REKTANGULÆRE skilt — «Sign.stp.» får ikke
    // plass på en 40 px rute uten å måtte brytes til uleselighet.
    //
    // Avstanden er bundet til målerens bredde: knappenes ytterkant
    // står rett over målerens kant, så raden og instrumentet under
    // har samme bredde. Da er ikke tallet valgt på slump, og det
    // følger med om måleren endrer størrelse.
    `<g class="bs"><circle id="bs-knapp-jord" cx="${bsMidt - knDx}" ` +
    `cy="${knCy}" r="${BSKNAPP}" fill="#111" stroke="#33363a" ` +
    `stroke-width="1" onclick="bsJord()"/>` +
    bsSkilt(bsMidt - knDx, knCy + 26, 56, 26, "Jord") + `</g>` +
    `<g class="bs"><circle id="bs-knapp-stopp" cx="${bsMidt + knDx}" ` +
    `cy="${knCy}" r="${BSKNAPP}" fill="#c9342a" stroke="#33363a" ` +
    `stroke-width="1" onclick="bsStopp()"/>` +
    bsSkilt(bsMidt + knDx, knCy + 26, 56, 26, "Sign.stp.") + `</g>` +
    // amperemeteret er selvforklarende og har intet skilt
    ampMaaler(bsMidt, ampCy, AMPBREDDE);
  ampNullstill();
  // RASTERET: stillere med SAMME farge står tett inntil hverandre,
  // og mellom to farger er det én stillerbredde luft. Fargen er
  // funksjonen — blå er låser, rigler og vekselstillere, gul er
  // Lok-frigivningen, rød er skiftesignalene — så gruppene leses som
  // grupper uten at noe måtte skrives på apparatet.
  //
  // Ruten er fast: hver stiller har samme bredde uansett hvor langt
  // navnet er. Før fikk samlelåsen 88 px og rigelen 96 fordi navnene
  // deres er lange, og stillerne sto i ujevn takt. Det er skiltet som
  // skal ta seg av teksten; stillerne er maskinvare og står på rekke.
  const BSRAST = 56;        // én stillerbredde (52 px skilt + luft)
  // Midtkolonnen er 2 x BSMIDTLUFT bred. Den skal romme
  // amperemeteret med god margin — måleren er 130, kolonnen 260.
  const BSMIDTLUFT = 130;   // fra midten ut til første stiller
  const bsRekke = (side, retning) => {
    let x = bsMidt + retning * (BSMIDTLUFT + BSRAST / 2);
    let forrige = null;
    for (const it of bsSide(side)) {
      if (forrige && it.farge !== forrige) x += retning * BSRAST;
      bsTegn(it, x);
      forrige = it.farge;
      x += retning * BSRAST;
    }
  };
  bsRekke("v", -1);
  bsRekke("h", 1);
  holder.innerHTML =
    `<svg id="plansvg" viewBox="${-kantV} 0 ${W + kantV + kantH} ` +
    `${H + BSH}" ` +
    `xmlns="http://www.w3.org/2000/svg">` +
    // SPORPLANENS HVITE FLATE. Den var en CSS-bakgrunn på
    // svg-elementet, men den lå bak ALT — også bak hammerlakken — og
    // langs lakkflatens underkant, der kanten lander på en brøkdels
    // skjermpiksel, skinte den gjennom som en hvit stripe.
    //
    // Den settes inn HER, ved sammenstillingen, og ikke i s. Omriss-
    // passet på sporbåndene limer sitt eget lag FORAN i s
    // (s = `<g>…</g>` + s), så «først i s» er ikke det samme som
    // først i tegningen — et rektangel lagt der ville malt over
    // båndomrissene.
    //
    // «Lagre SVG» blir riktigere på kjøpet: eksporten hadde ingen
    // bakgrunn, og hvilken farge planen fikk var opp til programmet
    // som åpnet fila.
    `<rect x="${-kantV}" y="0" width="${W + kantV + kantH}" ` +
    `height="${H}" fill="#fff"/>` +
    `${s}</svg>`;
  /* ---- tilstandsbindingene ---- */
  for (const fid of Object.keys(feltAv))
    planBind(`sporfelt/${fid}/state`, pl => {
      const m = pl === "fri" ? "pa" : "av";
      plSet(`pl-fl-${fid}`, m);
      plSet(`pl-fl-${fid}-b`, m);   // togsporene har to lamper
    });
  // Varselfeltlampa lyser FAST når feltet er fritt (som de andre
  // sporfeltlampene), blinker ved melding (tog i anmarsj), slukket
  // ved belegg — kombinert av begge tilstandstemaene
  for (const vf of varsel) {
    const oppdater = () => {
      const m = TIL[`varselfelt/${vf.id}/state`];
      const f2 = TIL[`sporfelt/${vf.id}/state`];
      plSet(`pl-vfl-${vf.id}`, m === "melding" ? "blink"
            : f2 === "fri" ? "pa" : "av");
    };
    planBind(`varselfelt/${vf.id}/state`, oppdater);
    planBind(`sporfelt/${vf.id}/state`, oppdater);
  }
  const tvOver = {};
  for (const t of tvs) {
    const lf = lfFor(t);
    if (lf) (tvOver[lf] = tvOver[lf] || []).push(t.id);
  }
  for (const [lf, ids] of Object.entries(tvOver)) {
    const oppdater = () => {
      const st = ids.map(id => TIL[`togvei/${id}/state`]);
      // Blink betyr ÉN ting: sikringen er ikke fullført, betjen
      // stillerne på nytt (ORV 3.4.2). Er togveien sikret, lyser
      // lampen fast — også mens hjelpeutløsningen går og mens den
      // venter på sistevognskontroll (3.4.3.1 og 3.4.3.2).
      plSet(`pl-tv-${lf}`,
            st.some(x => x === "aktiv" || x === "klar-utlos" ||
                         x === "hjelpeutlosning") ? "pa"
          : st.includes("sikring") ? "blink" : "av");
    };
    for (const id of ids) planBind(`togvei/${id}/state`, oppdater);
  }
  // AMPEREMETERET gjør utslag mens en drivmaskin trekker strøm.
  // Det er ikke pynt: «sporvekselstilleren holdes omlagt inntil
  // amperemeteret gjør utslag» (ORV 3.3.4) — utslaget er kvitteringen
  // på at maskinen faktisk gikk, og det er det operatøren ser etter.
  //
  // Samme regel som master kjører det FYSISKE instrumentet etter
  // (oppdaterAmperemeter): alle drivobjekter, så også sporsperrens
  // motor. Vi teller dem i et sett, for to veksler kan gå samtidig og
  // den siste som blir ferdig skal slippe viseren.
  const ampGaar = new Set();
  const ampBind = tema => planBind(tema, pl => {
    if (pl === "omlegging") ampGaar.add(tema); else ampGaar.delete(tema);
    ampSett(ampGaar.size > 0);
  });
  for (const litra of Object.keys(vx)) ampBind(`sporveksel/${litra}/state`);
  // Vekselstilleren slippes av SAMME melding som slipper viseren —
  // det er den samme hendelsen sett fra to kanter av apparatet.
  for (const litra of Object.keys(vx))
    planBind(`sporveksel/${litra}/state`,
             pl => bsVekselTilstand(litra, pl));
  for (const sp of sperrer) ampBind(`sporsperre/${sp.id}/state`);
  for (const litra of Object.keys(vx))
    planBind(`sporveksel/${litra}/state`, pl => {
      // uten tungekontroll (ingen sensorer, eller stilling ikke
      // bekreftet) er lampene bare SLUKKET — de blinker aldri
      if (!vSens[litra]) {
        plSet(`pl-vn-${litra}`, "av");
        plSet(`pl-va-${litra}`, "av");
        return;
      }
      plSet(`pl-vn-${litra}`, pl === "normal" ? "pa" : "av");
      plSet(`pl-va-${litra}`, pl === "avvik" ? "pa" : "av");
    });
  // sporvekselfeltlampene: som de andre feltlampene — lyser når
  // feltet er FRITT, slukker ved belegg
  for (const [litra, bf] of Object.entries(vFeltAv))
    planBind(`sporfelt/${bf}/state`, pl =>
      plSet(`pl-vfb-${litra}`, pl === "fri" ? "pa" : "av"));
  // SIGNALBILDENE styres av signaltyper-tabellen i konfig — samme
  // fasit som master driver de fysiske linsene med: bilder[state]
  // gir av/pa/blink per lampeindeks, delFor.cfg oversetter til
  // tegnet posisjon. Ukjent bilde (f.eks. «slukket» som mangler i
  // tabellen) slukker alle lampene.
  for (const f of fns) {
    const kl = sigKl(f) ||
      (String(f.type).startsWith("skiftesignal") ? "skiftesignal" : null);
    if (!kl || kl === "dvergsignal") continue;
    const bilder = (K.hal.signaltyper[f.type] || {}).bilder || {};
    const d = delFor(f);
    planBind(`${kl}/${f.id}/state`, pl => {
      const b = bilder[pl];
      d.ider.forEach((id, i) => {
        const m = b ? b[d.cfg[i]] : "av";
        plSet(id, m === "pa" ? "pa" : m === "blink" ? "blink" : "av");
      });
    });
  }
  // Én kontrollampe per lås, FAST lys når låst (Nelaug-regelen:
  // tent = i kontroll) — aldri blink. Sperresymbolet har ingen egen
  // lampe; rigel-etikettens lampe bærer gruppen.
  for (const l of laaser)
    planBind(`samlelaas/${l.id}/state`, pl =>
      plSet(`pl-sl-${l.id}`, pl === "sperret" ? "pa" : "av"));
  for (const l of rigler)
    planBind(`rigel/${l.id}/state`, pl =>
      plSet(`pl-ri-${l.id}`, pl === "sperret" ? "pa" : "av"));
  /* betjeningsfeltet: de stående stillerne følger tilstanden */
  for (const f of bsSkiftL)
    planBind(`skiftesignal/${f.id}/state`, v =>
      bsSett("skift", f.id,
             v === "skifting-tillatt" || v === "skifting-forbudt"));
  for (const l of laaser)
    planBind(`samlelaas/${l.id}/state`, v =>
      bsSett("samlelaas", l.id, !!v && v !== "sperret"));
  for (const l of rigler)
    // «etterlop» betyr at stilleren ER tatt tilbake — bare «frigitt»
    // holder den nede. Ellers kunne den ikke legges om igjen mens
    // etterløpet går, og master godtar nettopp det.
    planBind(`rigel/${l.id}/state`, v =>
      bsSett("rigel", l.id, v === "frigitt"));
  planBind("master/frigivning", v => {
    let o = {};
    try { o = JSON.parse(v); } catch (e) { /* uparselig: alt av */ }
    // STILLEREN følger stilleren, ikke frigivningen: i etterløpet
    // står frigivningen ved lag mens stilleren alt er tatt tilbake.
    // Sto den nede der, var det umulig å se at et nytt utslag hadde
    // virkning — og master godtar nettopp det («ny frigivning stryker
    // etterløpet»). Eldre firmware sender ikke stiller_*; da faller
    // vi tilbake på frigivningen, som før.
    bsSett("lok", "v", !!(o.stiller_v !== undefined ? o.stiller_v : o.venstre));
    bsSett("lok", "h", !!(o.stiller_h !== undefined ? o.stiller_h : o.hoyre));
  });
  // Gjennomgangsdrift: stilleren ligger nede når den er på (venter
  // eller aktiv); lampen blinker mens den venter, fast når aktiv
  planBind("master/gjennomgang", v => {
    bsSett("gg", "gg", v === "venter" || v === "aktiv");
    plSet("bs-la-gg", v === "aktiv" ? "pa" : v === "venter" ? "blink" : "av");
  });
  const bsStoppLampe = () =>
    plSet("bs-la-stopp",
          TIL["master/signalstopp"] === "paa" ||
          TIL["master/jord"] === "sperret" ? "pa" : "av");
  planBind("master/signalstopp", bsStoppLampe);
  planBind("master/jord", bsStoppLampe);
}
</script>
</body>
</html>
