        // stammen MOT 5 — Sp.III ligger på den forbindelsen, målt
        // fra veksel 5
        ke2 = kanter.find(k => {
          const a = posAv[k.fra.rad + "|" + k.fra.x];
          const b = posAv[k.til.rad + "|" + k.til.x];
          const makker = lik(k.fra, v.pos) ? b
                       : lik(k.til, v.pos) ? a : null;
          return makker && vx[makker] && vx[makker].stamme &&
                 vx[makker].stamme.veksel === li.veksel;
        });
      if (!ke2)
        ke2 = kanter.find(k => lik(k.fra, v.pos) || lik(k.til, v.pos));
      if (ke2) {
        const [ax, ay] = P(ke2.fra.rad, ke2.fra.x);
        const [bx, by] = P(ke2.til.rad, ke2.til.x);
        const dx = bx - ax, dy = by - ay;
        const pts = (dy !== 0 && Math.abs(dx) > Math.abs(dy))
          ? [[ax, ay], [ax + Math.sign(dx) * Math.abs(dy), by], [bx, by]]
          : [[ax, ay], [bx, by]];
        const bane = lik(ke2.fra, v.pos) ? pts : pts.slice().reverse();
        let rest = 48, pt = bane[0], ux = 1, uy = 0;
        for (let i = 1; i < bane.length && rest > 0; i++) {
          const sx2 = bane[i][0] - bane[i - 1][0];
          const sy2 = bane[i][1] - bane[i - 1][1];
          const sl = Math.hypot(sx2, sy2);
          ux = sx2 / sl; uy = sy2 / sl;   // segmentets (=båndets) retning
          if (rest <= sl) {
            pt = [bane[i - 1][0] + sx2 * rest / sl,
                  bane[i - 1][1] + sy2 * rest / sl];
            rest = 0;
          } else { pt = bane[i]; rest -= sl; }
        }
        p = { x: pt[0], y: pt[1], ux, uy };
        // etikett: på skrå kant legges den på tvers av kanten, bort
        // fra vekselens egen rad (ellers standard oppe til høyre)
        if (Math.abs(pt[1] - Y(v.pos.rad)) > 4) {
          const dside = pt[1] > Y(v.pos.rad) ? 1 : -1;
          p.lx = p.x + 22; p.ly = p.y + dside * 22;
        }
      }
    }
    if (p) {
      s += pbl.sperre(p.x, p.y, sp.id, p.ux || 1, p.uy || 0);
      sperrePos[sp.id] = p;
    }
  }
  const laaser = fns.filter(f => f.type === "samlelaas");
  const rigler = fns.filter(f => f.type === "rigel");
  let losX = 8;
  for (const l of rigler) {
    const sp = (l.omfatter || []).find(o => sperrePos[o]);
    const p = sp ? sperrePos[sp] : { x: losX += 170, y: topp - 20 };
    s += pbl.rigel(p.lx !== undefined ? p.lx : p.x + 24,
                   p.ly !== undefined ? p.ly : p.y - 16,
                   l.id, l.navn || l.id);
  }
  for (const l of laaser) {
    // Omfatter låsen en TEGNET SPORSPERRE, står nøkkelfeltet over
    // den (Grindvoll: S.lås I over Sp.I på sidesporet). Ellers ved
    // TUNGA på den av låsens veksler som ligger LENGST FRA
    // HOVEDSPORET (Sokna: nord for tunga på veksel 11) — utsiden av
    // båndet. Alt avledet av omfatter-lista + rad/spiss.
    const spm = (l.omfatter || []).find(o => sperrePos[o]);
    if (spm) {
      s += pbl.noekkelfelt(sperrePos[spm].x - 11,
                           sperrePos[spm].y - 48, l.id, l.navn || l.id);
      continue;
    }
    let mv = null;
    for (const o of (l.omfatter || [])) {
      const v = vx[o];
      if (v && v.pos &&
          (!mv || Math.abs(v.pos.rad) >= Math.abs(mv.pos.rad))) mv = v;
    }
    let p;
    if (mv) {
      const tx = X(mv.pos.x) + (mv.spiss === "v" ? -26 : 26);
      const over = mv.pos.rad >= 0;   // sør for hovedsporet: under
      p = { x: tx - 11, y: Y(mv.pos.rad) + (over ? -48 : 26) };
    } else {
      p = { x: losX += 170, y: topp - 30 };
    }
    s += pbl.noekkelfelt(p.x, p.y, l.id, l.navn || l.id);
  }
  // Omriss på sporbåndene, samme som lampene: hvert plspor-strøk
  // tegnes først som et 3 px bredere mørkt understrøk — det grå
  // båndet oppå etterlater 1 px kant. Skjøtene males over av
  // naboens grå, så sammenhengende spor forblir sammenhengende.
  // SKJØTENE: bånd som fortsetter i vinkel (rett -> diagonal) må
  // GJÆRES, ikke buttes — ellers får både gråfargen og omrisset hakk
  // i ytterhjørnet. Alle plspor-banene brytes derfor ned i segmenter,
  // flettes til sammenhengende polylinjer gjennom alle punkter der
  // nøyaktig to segmentender møtes, og tegnes så på nytt i to lag:
  // mørkt underlag (omriss, +3 px) og grått bånd — begge med miter-
  // gjæring. Åpne ender forlenges 1 px så endeflaten får kant.
  // Punkter der TRE baner møtes (vekselpunktene) beholdes som butt:
  // gjennomgående bånd er kollineære der (usynlig skjøt), og
  // greinens ende dekkes av båndet den går inn i.
  const parse = d => {
    const t = d.match(/[MLHV][^MLHVa-z]+/g);
    if (!t || t.join("") !== d) return null;
    const pts = []; let x = 0, y = 0;
    for (const seg of t) {
      const k = seg[0];
      const nums = seg.slice(1).trim().split(/[ ,]+/).map(Number);
      if (nums.some(isNaN)) return null;
      if (k === "M" || k === "L") { x = nums[0]; y = nums[1]; }
      else if (k === "H") x = nums[0];
      else if (k === "V") y = nums[0];
      else return null;
      pts.push([x, y]);
    }
    return pts.length >= 2 ? pts : null;
  };
  const segs = [], rest = [];
  for (const m of s.matchAll(/<path class="plspor"([^>]*)\/>/g)) {
    const attrs = m[1];
    const d = (attrs.match(/ d="([^"]+)"/) || [])[1];
    if (!d) continue;
    const w = +((attrs.match(/stroke-width:\s*([\d.]+)/) || [])[1] || 12);
    const pts = w === 12 ? parse(d) : null;
    if (!pts) { rest.push({ d, w }); continue; }
    for (let i = 1; i < pts.length; i++)
      segs.push([pts[i - 1], pts[i]]);
  }
  const nk = p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`;
  const grad = {};
  for (const [a, b] of segs) {
    (grad[nk(a)] = grad[nk(a)] || []).push([a, b]);
    (grad[nk(b)] = grad[nk(b)] || []).push([b, a]);
  }
  const brukt = new Set();
  const kjeder = [];
  const segId = (a, b) => [nk(a), nk(b)].sort().join("|");
  for (const [a0, b0] of segs) {
    if (brukt.has(segId(a0, b0))) continue;
    // vandre begge veier gjennom grad-2-punkter
    const kjede = [a0, b0];
    brukt.add(segId(a0, b0));
    for (const retn of [1, 0]) {
      for (;;) {
        const ende = retn ? kjede[kjede.length - 1] : kjede[0];
        const naboer = grad[nk(ende)] || [];
        if (naboer.length !== 2) break;
        const neste = naboer.map(n => n[1])
          .find(p => !brukt.has(segId(ende, p)));
        if (!neste) break;
        brukt.add(segId(ende, neste));
        retn ? kjede.push(neste) : kjede.unshift(neste);
      }
    }
    kjeder.push(kjede);
  }
  const ut = (a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const l = Math.hypot(dx, dy) || 1;
    return [b[0] + dx / l * 1, b[1] + dy / l * 1];
  };
  let under = "", graa = "";
  for (const kj of kjeder) {
    const p = kj.map(q => [...q]);
    if ((grad[nk(kj[0])] || []).length === 1)
      p[0] = ut(p[1], p[0]);
    if ((grad[nk(kj[kj.length - 1])] || []).length === 1)
      p[p.length - 1] = ut(p[p.length - 2], p[p.length - 1]);
    const dU = "M" + p.map(q => `${q[0].toFixed(1)},${q[1].toFixed(1)}`)
                      .join(" L");
    const dG = "M" + kj.map(q => `${q[0].toFixed(1)},${q[1].toFixed(1)}`)
                       .join(" L");
    under += `<path d="${dU}" fill="none" stroke="#33363a" ` +
      `stroke-width="14" stroke-linecap="butt" stroke-linejoin="miter"/>`;
    graa += `<path d="${dG}" fill="none" stroke="#8d9094" ` +
      `stroke-width="12" stroke-linecap="butt" stroke-linejoin="miter"/>`;
  }
  for (const r of rest)   // baner som ikke lot seg flette
    under += `<path d="${r.d}" fill="none" stroke="#33363a" ` +
      `stroke-width="${r.w + 2}" stroke-linecap="butt"/>`;
  s = `<g>${under}${graa}</g>` + s;
  /* ---- BETJENINGSFELTET (grønn flate under transparenten) ----
     Nedre del av apparatet, farger etter dagens regelverk (ORV
     kap. 3.3): skiftesignalstillere RØDE (blir stående),
     sporvekselstillere BLÅ (tilbakefjærende, + opp / − ned),
     frigivning av samlelås/rigel BLÅ (blir stående), Lok-frigivning
     GULE, Jord sort og Sign.stp rød trykknapp med felles kontrollampe
     (signalstopp/jordfeil), amperemeter i midten. */
  const bsSkiftL = fns.filter(f =>
    String(f.type).startsWith("skiftesignal"));
  const bsVeksL = Object.keys(vSentral).filter(l => vSentral[l])
    .sort((a, b) => a.localeCompare(b, "nb", { numeric: true }));
  const BSH = 150, bsY0 = H, bsCy = H + 78;
  // Amperemeteret står SENTRERT på panelet, Jord og Sign.stp. ved
  // siden av hverandre OVER det. Stillerne fordeles til venstre og
  // høyre for midten etter hvilken side av transparenten objektet
  // hører til, i rekkefølge fra midten og utover: S-lås, rigel,
  // vekselstiller, lokal frigiving, skiftesignal.
  const bsMidt = W / 2;
  const sideAvX = x => (x < bsMidt ? "v" : "h");
  const bsSkiftSide = f => {
    const m = master[`sk-${f.id}`] ||
              (f.montert_med && master[f.montert_med]);
    return m ? sideAvX(m.px) : "h";
  };
  const bsVekselSide = l =>
    vx[l] && vx[l].pos ? sideAvX(X(vx[l].pos.x)) : "v";
  const bsLaasSide = l => {
    for (const o of l.omfatter || []) {
      if (vx[o] && vx[o].pos) return sideAvX(X(vx[o].pos.x));
      if (sperrePos[o]) return sideAvX(sperrePos[o].x);
    }
    return "v";
  };
  const bsSide = side => {
    const ut = [];
    for (const l of laaser)
      if (bsLaasSide(l) === side)
        ut.push({ slag: "samlelaas", id: l.id, farge: "#2b6fc2",
                  navn: l.navn || l.id, w: 88 });
    for (const l of rigler)
      if (bsLaasSide(l) === side)
        ut.push({ slag: "rigel", id: l.id, farge: "#2b6fc2",
                  navn: l.navn || l.id, w: 96 });
    for (const l of bsVeksL)
      if (bsVekselSide(l) === side)
        ut.push({ slag: "veksel", id: l, farge: "#2b6fc2",
                  navn: l, pluss: true });
    ut.push({ slag: "lok", id: side, farge: "#d8a400",
              navn: side === "v" ? "Lok I" : "Lok II",
              lampe: `bs-la-lok-${side}` });
    for (const f of bsSkiftL)
      if (bsSkiftSide(f) === side)
        ut.push({ slag: "skift", id: f.id, farge: "#c9342a",
                  navn: f.id });
    return ut;
  };
  s += `<rect x="${-kantV}" y="${bsY0}" ` +
    `width="${W + kantV + kantH}" height="${BSH}" fill="#46704f"/>`;
  const bsTegn = (it, cx) => {
    s += `<g class="bs">` +
      (it.pluss
        ? `<text class="bstegn" x="${cx}" y="${bsCy - 32}">+</text>` +
          `<text class="bstegn" x="${cx}" y="${bsCy + 42}">−</text>`
        : "") +
      (it.lampe
        ? `<circle id="${it.lampe}" class="pl" ` +
          `style="color:#e8e8dc" cx="${cx}" cy="${bsCy - 38}" r="6"/>`
        : "") +
      `<rect x="${cx - 2.5}" y="${bsCy - 24}" width="5" height="48" ` +
      `rx="2.5" fill="#24262a"/>` +
      `<circle id="bs-kn-${it.slag}-${it.id}" class="bskn" ` +
      `cx="${cx}" cy="${bsCy}" r="8" fill="${it.farge}" ` +
      `stroke="#1c1e21" stroke-width="1.5" pointer-events="none"/>` +
      `<rect x="${cx - 15}" y="${bsCy - 26}" width="30" height="26" ` +
      `fill="transparent" ` +
      `onclick="bsDytt('${it.slag}','${it.id}','opp')"/>` +
      `<rect x="${cx - 15}" y="${bsCy}" width="30" height="26" ` +
      `fill="transparent" ` +
      `onclick="bsDytt('${it.slag}','${it.id}','ned')"/>` +
      `<text class="bsnavn" x="${cx}" ` +
      `y="${bsCy + (it.pluss ? 56 : 42)}">${it.navn}</text></g>`;
  };
  // midtgruppen: kontrollampe (signalstopp/jordfeil) øverst, Jord og
  // Sign.stp. ved siden av hverandre, amperemeteret under
  const ampCy = bsY0 + 96, knCy = bsY0 + 36;
  s += `<circle id="bs-la-stopp" class="pl" style="color:#ff2a1e" ` +
    `cx="${bsMidt}" cy="${bsY0 + 12}" r="6"/>` +
    `<g class="bs"><circle id="bs-knapp-jord" cx="${bsMidt - 24}" ` +
    `cy="${knCy}" r="10" fill="#111" stroke="#585b60" ` +
    `stroke-width="1.5" onclick="bsJord()"/>` +
    `<text class="bsnavn" x="${bsMidt - 24}" y="${knCy + 24}">` +
    `Jord</text></g>` +
    `<g class="bs"><circle id="bs-knapp-stopp" cx="${bsMidt + 24}" ` +
    `cy="${knCy}" r="10" fill="#c9342a" stroke="#585b60" ` +
    `stroke-width="1.5" onclick="bsStopp()"/>` +
    `<text class="bsnavn" x="${bsMidt + 24}" y="${knCy + 24}">` +
    `Sign.stp.</text></g>` +
    `<g><circle cx="${bsMidt}" cy="${ampCy}" r="20" ` +
    `fill="#f5f2e6" stroke="#33363a" stroke-width="1.5"/>` +
    `<line id="pl-amp" x1="${bsMidt}" y1="${ampCy + 6}" ` +
    `x2="${bsMidt - 11}" y2="${ampCy - 8}" stroke="#111" ` +
    `stroke-width="2"/>` +
    `<text class="bsnavn" x="${bsMidt}" y="${ampCy + 34}">Amp.</text>` +
    `</g>`;
  let bsXV = bsMidt - 56;               // venstre side, fra midten ut
  for (const it of bsSide("v")) {
    const w = it.w || 64;
    bsTegn(it, bsXV - w / 2);
    bsXV -= w;
  }
  let bsXH = bsMidt + 56;               // høyre side, fra midten ut
  for (const it of bsSide("h")) {
    const w = it.w || 64;
    bsTegn(it, bsXH + w / 2);
    bsXH += w;
  }
  holder.innerHTML =
    `<svg id="plansvg" viewBox="${-kantV} 0 ${W + kantV + kantH} ` +
    `${H + BSH}" ` +
    `xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
  /* ---- tilstandsbindingene ---- */
  for (const fid of Object.keys(feltAv))
    planBind(`sporfelt/${fid}/state`, pl => {
      const m = pl === "fri" ? "pa" : "av";
      plSet(`pl-fl-${fid}`, m);
      plSet(`pl-fl-${fid}-b`, m);   // togsporene har to lamper
    });
  // Varselfeltlampa lyser FAST når feltet er fritt (som de andre
  // sporfeltlampene), blinker ved melding (tog i anmarsj), slukket
  // ved belegg — kombinert av begge tilstandstemaene
  for (const vf of varsel) {
    const oppdater = () => {
      const m = TIL[`varselfelt/${vf.id}/state`];
      const f2 = TIL[`sporfelt/${vf.id}/state`];
      plSet(`pl-vfl-${vf.id}`, m === "melding" ? "blink"
            : f2 === "fri" ? "pa" : "av");
    };
    planBind(`varselfelt/${vf.id}/state`, oppdater);
    planBind(`sporfelt/${vf.id}/state`, oppdater);
  }
  const tvOver = {};
  for (const t of tvs) {
    const lf = lfFor(t);
    if (lf) (tvOver[lf] = tvOver[lf] || []).push(t.id);
  }
  for (const [lf, ids] of Object.entries(tvOver)) {
    const oppdater = () => {
      const st = ids.map(id => TIL[`togvei/${id}/state`]);
      plSet(`pl-tv-${lf}`,
            st.includes("aktiv") ? "pa"
          : st.some(x => x === "sikring" || x === "klar-utlos" ||
                         x === "hjelpeutlosning") ? "blink" : "av");
    };
    for (const id of ids) planBind(`togvei/${id}/state`, oppdater);
  }
  for (const litra of Object.keys(vx))
    planBind(`sporveksel/${litra}/state`, pl => {
      // uten tungekontroll (ingen sensorer, eller stilling ikke
      // bekreftet) er lampene bare SLUKKET — de blinker aldri
      if (!vSens[litra]) {
        plSet(`pl-vn-${litra}`, "av");
        plSet(`pl-va-${litra}`, "av");
        return;
      }
      plSet(`pl-vn-${litra}`, pl === "normal" ? "pa" : "av");
      plSet(`pl-va-${litra}`, pl === "avvik" ? "pa" : "av");
    });
  // sporvekselfeltlampene: som de andre feltlampene — lyser når
  // feltet er FRITT, slukker ved belegg
  for (const [litra, bf] of Object.entries(vFeltAv))
    planBind(`sporfelt/${bf}/state`, pl =>
      plSet(`pl-vfb-${litra}`, pl === "fri" ? "pa" : "av"));
  // SIGNALBILDENE styres av signaltyper-tabellen i konfig — samme
  // fasit som master driver de fysiske linsene med: bilder[state]
  // gir av/pa/blink per lampeindeks, delFor.cfg oversetter til
  // tegnet posisjon. Ukjent bilde (f.eks. «slukket» som mangler i
  // tabellen) slukker alle lampene.
  for (const f of fns) {
    const kl = sigKl(f) ||
      (String(f.type).startsWith("skiftesignal") ? "skiftesignal" : null);
    if (!kl || kl === "dvergsignal") continue;
    const bilder = (K.hal.signaltyper[f.type] || {}).bilder || {};
    const d = delFor(f);
    planBind(`${kl}/${f.id}/state`, pl => {
      const b = bilder[pl];
      d.ider.forEach((id, i) => {
        const m = b ? b[d.cfg[i]] : "av";
        plSet(id, m === "pa" ? "pa" : m === "blink" ? "blink" : "av");
      });
    });
  }
  // Én kontrollampe per lås, FAST lys når låst (Nelaug-regelen:
  // tent = i kontroll) — aldri blink. Sperresymbolet har ingen egen
  // lampe; rigel-etikettens lampe bærer gruppen.
  for (const l of laaser)
    planBind(`samlelaas/${l.id}/state`, pl =>
      plSet(`pl-sl-${l.id}`, pl === "sperret" ? "pa" : "av"));
  for (const l of rigler)
    planBind(`rigel/${l.id}/state`, pl =>
      plSet(`pl-ri-${l.id}`, pl === "sperret" ? "pa" : "av"));
  /* betjeningsfeltet: de stående stillerne følger tilstanden */
  for (const f of bsSkiftL)
    planBind(`skiftesignal/${f.id}/state`, v =>
      bsSett("skift", f.id,
             v === "skifting-tillatt" || v === "skifting-forbudt"));
  for (const l of laaser)
    planBind(`samlelaas/${l.id}/state`, v =>
      bsSett("samlelaas", l.id, !!v && v !== "sperret"));
  for (const l of rigler)
    planBind(`rigel/${l.id}/state`, v =>
      bsSett("rigel", l.id, !!v && v !== "sperret"));
  planBind("master/frigivning", v => {
    let o = {};
    try { o = JSON.parse(v); } catch (e) { /* uparselig: alt av */ }
    bsSett("lok", "v", !!o.venstre);
    bsSett("lok", "h", !!o.hoyre);
    plSet("bs-la-lok-v", o.venstre ? "pa" : "av");
    plSet("bs-la-lok-h", o.hoyre ? "pa" : "av");
  });
  const bsStoppLampe = () =>
    plSet("bs-la-stopp",
          TIL["master/signalstopp"] === "paa" ||
          TIL["master/jord"] === "sperret" ? "pa" : "av");
  planBind("master/signalstopp", bsStoppLampe);
  planBind("master/jord", bsStoppLampe);
}
</script>
</body>
</html>
