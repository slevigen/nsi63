<!DOCTYPE html>
<!-- NSI63 digitalt stillerapparat — MILEPÆL 1: TEKSTPANELET.
     Tekstpanel uten grafikk, men fullt fungerende:
     ren MQTT-klient over WebSocket rett mot mosquitto (port 9001) —
     Flask serverer bare denne fila og mqtt.min.js, og er ellers ikke
     i løypa. Panelet SELVKONFIGURERES fra retained config-temaer
     (nsi63/config/hal + forrigling + anlegg) og har ingen egen
     autoritet: all betjening publiseres til de samme temaene som
     HAL-UI og det fysiske apparatet, og forrigles av master.
     Mistes forbindelsen: fail-safe FRAKOBLET-overlegg umiddelbart. -->
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2a3222">
<link rel="manifest" href="/panel/manifest.json">
<link rel="icon" href="/panel/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/panel/icon-192.png">
<title>NSI63 — stillerapparat</title>
<style>
  :root { color-scheme: dark;
          /* Pennebredden på skiltingen over apparatet. Står på 0:
             Nordvester har tyngde nok selv. Streken var kompensasjon
             for Routed Gothic, som er en monolinje-tegnefont uten
             bold — bytter skiltfonten tilbake til noe tynt, er det
             her tyngden hentes. Over 0,7 tettes de trange
             bokstavene. */
          --skiltstrek: 0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Grønnfargen er apparatrommets, ikke en skjermfarge — siden skal
     ligne stillerapparatet, ikke et dashbord. */
  body { margin: 0; background: #2a3222; color: #d7d9dc;
         font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         padding-bottom: 90px; }
  /* Skiltingen over apparatet: stasjonen midtstilt, nabostasjonene i
     hver sin ende av linjen — venstre og høyre som sporplanen tegnes.
     Rutenettet er 1fr auto 1fr, så MIDTEN er midten uansett hvor
     lange nabonavnene er; med flex ville et langt navn dyttet
     stasjonen ut av senter. */
  header { position: sticky; top: 0; z-index: 5; background: #2a3222;
           padding: 10px 14px; border-bottom: 1px solid #1d2318;
           display: grid; grid-template-columns: 1fr auto 1fr;
           align-items: baseline; column-gap: 14px; }
  header h1, header .nabo {
    font-family: "Nordvester", "Routed Gothic", sans-serif;
    font-weight: 400;
    color: #fff; -webkit-text-stroke: var(--skiltstrek) currentColor; }
  header h1 { font-size: 46px; margin: 0; letter-spacing: 8px;
              white-space: nowrap; }
  header .nabo { font-size: 34px; letter-spacing: 4px;
                 white-space: nowrap; overflow: hidden;
                 text-overflow: ellipsis; }
  header #nabo-v { text-align: left; }
  header #nabo-h { text-align: right; }
  /* Pilene ligger INLINE, ikke i en flexboks: en flexboks henter
     grunnlinjen sin fra første barn, og det er pilen — da ville de tre
     navnene sluttet å stå på samme linje. */
  /* Pilen måles i EM, ikke piksler: den hører til nabonavnet og skal
     følge det. Med faste piksler ble den stående igjen som en liten
     rest da navnene ble doblet. 0,76em høyde x 3,125 er pilens eget
     format (viewBox 100x32), så den skaleres uten å bli trykt. */
  header .pil { height: 0.76em; width: 2.375em; fill: #fff;
                vertical-align: -0.06em; }
  header #nabo-v .pil { margin-right: 0.47em; }
  header #nabo-h .pil { margin-left: 0.47em; transform: scaleX(-1); }
  .hint { color: #8b9096; font-size: 12.5px; }
  section { margin: 10px 12px; background: #202327; border-radius: 10px;
            padding: 10px 12px; }
  h2 { font-size: 13px; margin: 0 0 6px; color: #9aa0a7;
       text-transform: uppercase; letter-spacing: 1px; }
  .rad { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
         padding: 7px 0; border-top: 1px solid #2c2f33; }
  .rad:first-of-type { border-top: 0; }
  .litra { font-weight: 700; min-width: 52px; font-size: 16px; }
  .st { min-width: 110px; font-family: ui-monospace, Menlo, monospace;
        font-size: 14px; }
  .st.ledig  { color: #6f757c; }
  .st.aktiv  { color: #5bb974; }
  .st.varsel { color: #e0c23c; animation: blinkA 1s step-start infinite; }
  .st.roed   { color: #e05252; }
  @keyframes blinkA { 50% { opacity: .15; } }  /* 1 Hz, 1:1 — forbildet */
  button { background: #2c3036; color: #e8eaec;
           border: 1px solid #43484e; border-radius: 8px;
           font-size: 14.5px; padding: 10px 14px; min-height: 44px;
           min-width: 64px; touch-action: manipulation;
           user-select: none; -webkit-user-select: none; }
  button:active { background: #4a5058; }
  .info { flex-basis: 100%; font-size: 12.5px; color: #b9a44c;
          font-family: ui-monospace, Menlo, monospace; min-height: 1em; }
  #logg { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
          color: #8b9096; white-space: pre-wrap; }
  /* ---- sporplanen (milepæl 2, plassholderblokker) ----
     Kontrakt mot blokkbiblioteket: modul 100×60, sporlinjen i
     y=30, inn/ut på modulkanten, lampelinser som egne objekter
     tegnet i tent farge (klassene under mørker/blinker dem). Hver
     plassholderblokk er én funksjon (pbl.*) — kunstverket byttes
     inn blokk for blokk uten å røre komposisjonen. */
  @font-face {   /* skiltfonten — servert lokalt av Flask */
    font-family: "Routed Gothic";
    src: url("/panel/routed-gothic.ttf") format("truetype");
  }
  /* Stasjonsnavnene. Nordvester er Norwester utvidet med de norske
     bokstavene — originalen har verken Æ, Ø eller Å, og ØRGENVIKA
     ville fått sin Ø fra en fallbackfont: bredere og tynnere enn
     nabobokstavene. Begge er SIL OFL. */
  @font-face {
    font-family: "Nordvester";
    src: url("/panel/Nordvester-Regular.ttf") format("truetype");
  }
  /* Stasjonsnavnene står i Nordvester — en smal, tung display-font
     som ligner skiltingen over et apparat. Sporplanens egne skilt
     beholder Routed Gothic; de er graverte plater, ikke skilt på
     veggen. */
  /* Hvit flate som apparatet; grå spor, svart tekst. Hver lampe
     bærer begge fargene sine (--av slukket, --pa tent). Alle r=6. */
  /* Samme sidemargin som kortene under, så apparatet står i flukt
     med dem — det er bare boksen som er borte, ikke plasseringen. */
  #planholder { margin: 10px 12px; }
  #plansvg { width: 100%; height: auto; display: block;
             border-radius: 8px; }
  /* Linsen har TO farger, og den slukkede er valgt for seg — den
     regnes ikke ut av den tente. Blandingen som sto her før virket
     for alle kulører unntatt gul: mørk oransjegul ER brun, uansett
     hvor lite av den man tar med. Fargen må forlate gultonen for å
     slippe unna, og det kan en blanding ikke gjøre. Parene står i
     ui/signalfarger.js, som lampeStil() setter i --pa og --av. */
  .pl { fill: var(--av, #3f454e); stroke: #33363a; stroke-width: 1; }
  .pl.pa { fill: var(--pa); }
  /* Blink drives av ÉN felles fase-klokke (JS toggler body.blinkfase)
     — som forbildets ene blinkapparat: alle blinkende lamper i hele
     anlegget lyser og slukker SAMTIDIG. CSS-animasjon per element
     ville startet på klassetildelingen og gitt utakt. Mørkfasen er
     samme mørke farge som slukket linse. */
  body.blinkfase .pl.blink { fill: var(--pa); }
  .plspor { stroke: #8d9094; stroke-width: 12; fill: none;
            stroke-linecap: butt; }   /* like tykk som lampene, rette ender */
  .pltekst { fill: #111; font: 12px "Routed Gothic",
             ui-monospace, Menlo, monospace; }
  .plnavn { fill: #111; font: 11px "Routed Gothic",
            -apple-system, sans-serif; }
  .plklikk { cursor: pointer; }
  /* togveistilleren: RØD knott (fasit fra apparatet) med dyttgest —
     klikk venstre/høyre halvdel dytter, knotten fjærer tilbake */
  .pltvs { cursor: pointer; }
  /* den sorte trykknappen (meldeknappen) ved linjefeltet: kvitterer
     varselklokka og løser ut innkjørtogvei som venter på kvittering */
  .plknapp { cursor: pointer; }
  .plknapp .knhode { fill: #111; stroke: #33363a; stroke-width: 1; }
  /* betjeningsfeltet (grønn flate under transparenten) */
  .bs { cursor: pointer; }
  .bs .bskn { transition: transform .12s ease-out; }
  /* Skiltene: sort på hvitt, som forbildets graverte plater.
     Skriftstørrelsen settes per skilt av bsSkilt(), som bryter teksten
     til å passe — derfor står ingen font-size her. */
  .bsplate { fill: #f2efe4; stroke: #1c1e21; stroke-width: 1; }
  /* Amperemeteret. Viseren har treghet som et virkelig
     dreiespoleinstrument — den svinger, den hopper ikke. */
  .ampskive { fill: #f2efe4; }
  .ampsort { fill: #14181c; }
  .amptekst { fill: #14181c; font-weight: 700;
              font-family: "Arial Narrow", "Helvetica Neue", sans-serif; }
  /* Standardstørrelsen. En linje som ikke får plass får sin egen,
     mindre størrelse satt av bsSkilt() — derfor style="font-size"
     der. */
  .bsskilt { fill: #111; font: 12px "Routed Gothic",
             "Share Tech Mono", monospace; text-anchor: middle; }
  .pltvs .knott { fill: #c9342a; stroke: #33363a; stroke-width: 1;
                  transition: transform .12s ease-out; }
  /* skille mellom sporfelt i forriglingen: svart tverrstrek i båndet */
  .plskille { fill: #111; }
  #frakoblet { position: fixed; inset: 0; z-index: 50;
               background: rgba(10,10,12,.88); display: none;
               align-items: center; justify-content: center;
               font-size: 34px; font-weight: 800; letter-spacing: 3px;
               color: #e05252; text-align: center; }
  body.dod #frakoblet { display: flex; }
  /* Kontrollinjen: under betjeningsfeltet, utenfor frontplata. Den
     hører til nettbrettet, ikke apparatet, og skal se ut som det. */
  #kontroll { display: flex; justify-content: flex-end; align-items: center;
              gap: 14px; margin: -2px 12px 12px; font-size: 12px;
              color: #9aa08f; }
  #kontroll button { font-size: 12px; padding: 3px 9px; }
  #kontroll .klikk { cursor: pointer; text-decoration: underline dotted; }
  #kontroll-hint { margin: -6px 12px 12px; font-size: 12px;
                   color: #9aa08f; text-align: right; }
  /* Instruksen over panelet — under FRAKOBLET-overlegget, som alltid
     skal synes, og uten å forlate siden (WebSocket-en lever videre) */
  #instruks { position: fixed; inset: 0; z-index: 40; display: none;
              background: rgba(10,12,8,.8); padding: 3vh 3vw; }
  #instruks.apen { display: flex; flex-direction: column; }
  #instruks .topp { display: flex; justify-content: flex-end;
                    margin-bottom: 6px; }
  #instruks iframe { flex: 1; width: 100%; border: 1px solid #3d4636;
                     border-radius: 6px; background: #1d2318; }
  body.dod main { filter: grayscale(1) brightness(.6); }
</style>
</head>
<body class="dod">
<header>
  <!-- Retningspilene: hode, skaft og kløftet bakende, som skiltene på
       apparatet. Skaftet er tykkere enn på forbildet — i 13 piksler
       forsvinner et tynt skaft, og pilen blir en klump. -->
  <span class="nabo" id="nabo-v">
    <svg class="pil" viewBox="0 0 100 32" aria-hidden="true">
      <path d="M0,16 L26,2 L26,11 L58,11 L58,1 L100,1 L87,16 L100,31 L58,31 L58,21 L26,21 L26,30 Z"/></svg><span class="navn"></span></span>
  <h1 id="tittel"></h1>
  <span class="nabo" id="nabo-h"><span class="navn"></span>
    <svg class="pil" viewBox="0 0 100 32" aria-hidden="true">
      <path d="M0,16 L26,2 L26,11 L58,11 L58,1 L100,1 L87,16 L100,31 L58,31 L58,21 L26,21 L26,30 Z"/></svg></span>
</header>
<main id="hoved">
  <section><p class="hint">Venter på konfigurasjon fra brokeren
  (retained <code>nsi63/config/…</code>) — kommer normalt i løpet av
  et sekund etter tilkobling.</p></section>
</main>
<div id="instruks"><div class="topp">
  <button onclick="instruksLukk()">Lukk instruks</button></div>
  <iframe title="Instruks"></iframe></div>
<div id="frakoblet">FRAKOBLET<br>
  <span style="font-size:15px;font-weight:400;color:#d7d9dc">
  panelet viser ikke gyldig tilstand</span></div>

<script src="/panel/mqtt.js"></script>
<script src="/ui/signalfarger.js"></script>
<script>
"use strict";
/* ---------- tilstand ---------- */
const ROT = "nsi63/";
const K = { hal: null, fr: null, anlegg: null };   // konfigene
// Begge vekseltypene. «sporveksel» er sentralstilt og inngår i
// forriglingen; «manuellveksel» er håndstilt og står utenfor — men
// panelet TEGNER og betjener begge, og de deler MQTT-rotnavnet
// nsi63/sporveksel/<litra>/…. Det er forriglingen de skilles i, ikke
// flaten.
const erVeksel = t => t === "sporveksel" || t === "manuellveksel";
// Hvilken vei avviket ligger for hver sentralstilt veksel, avledet av
// SPORPLANEN: går avviksgreina oppover i tegningen, legges stilleren
// opp for avvik — og motsatt. Apparatet skal kunne leses av som et
// bilde av sporet, ikke som en tabell man må huske.
// Fylles av byggPlan; true = avvik oppover (antatt når ukjent).
const VAVVIKOPP = {};
// Stillerens utslag og knottens radius. Sporet regnes ut av disse, så
// et større utslag gir et lengre spor av seg selv — knotten skal
// vandre HELE sporet, fra kant til kant, ellers ser bevegelsen mindre
// ut enn den er.
const BSUTSLAG = 25, BSKNOTT = 8;
// TRYKKNAPPENE har alle samme diameter — Jord og Sign.stp på
// betjeningsfeltet og meldeknappen ved linjefeltet var 10, 10 og 7,
// altså tre størrelser på det som er samme slags håndtak.
//
// Verdien er stillerknottens, men konstanten er EGEN: knapper og
// stillere ser like ut i dag, og det er ikke sikkert de skal gjøre
// det i morgen. Da kan denne endres uten å røre stillerne.
const BSKNAPP = BSKNOTT;
const BSKNAPPINN = 2;   // hvor mye knappen synker mens den trykkes
// Hvor langt sporet trekkes INN fra knottens ytterkant i hver ende.
// Knotten dekker da enden av sporet i endestillingen i stedet for å
// stå flukt med den. Med innrykk lik knottradien er sporet nøyaktig
// banen knottens SENTER går i: 2 x BSUTSLAG for en stiller som går
// begge veier (50 px), BSUTSLAG for en som bare går ned (25 px).
const BSSPORINN = 8;
// Hvor lenge en stiller står omlagt før den fjærer tilbake uten
// bekreftelse fra anlegget. Rikelig for en tur til master og hjem
// over den lokale brokeren; kort nok til å leses som en fjær.
const BSVENTSTART = 1500;
// Sporet stilleren vandrer i. ÉN funksjon for begge orienteringene:
// togveistillerne på planen ligger vannrett og betjeningsfeltets
// stillere loddrett, men de er samme slags stiller og skal se like
// ut. Endres BSUTSLAG/BSKNOTT/BSSPORINN, følger begge med.
//
// Sporet er like langt til begge sider på ALLE stillerne, også de
// som bare kan legges én vei. Sporet er en utfresing i frontplata,
// og på et virkelig apparat freses den likt uansett hva stilleren
// bak den kan gjøre — det er stilleren som er sperret, ikke sporet
// som er kortere. Et halvt spor ville dessuten satt hvilepunktet
// visuelt i enden i stedet for i midten.
function bsSpor(cx, cy, vannrett) {
  const ut = BSUTSLAG + BSKNOTT - BSSPORINN;
  const fra = -ut;
  const len = ut - fra;
  const x = vannrett ? cx + fra : cx - 3.5;
  const y = vannrett ? cy - 3.5 : cy + fra;
  return `<rect x="${x}" y="${y}" ` +
    `width="${vannrett ? len : 7}" height="${vannrett ? 7 : len}" ` +
    `fill="#7c7f83" stroke="#4a4d51" stroke-width="1"/>`;
}
const TIL = {};        // tema (uten rot) -> siste payload
const BIND = {};       // tema -> [oppdateringsfunksjoner]
let bygget = false;

/* ---------- kontrollinjen: lyd, skjerm, instruks ---------- */
// Klokken. Master melder nsi63/master/klokke/state: «ringer»
// (kontinuerlig), «stott» (avvist-støtet) eller «av». Lyden er AV til
// den slås på her, og valget huskes i nettleseren: et nettbrett skal
// ikke begynne å ringe av seg selv der det står en fysisk klokke.
const LYD = { paa: false, ctx: null, ring: 0, tilstand: "av" };
try { LYD.paa = localStorage.getItem("nsi63-panel-lyd") === "paa"; }
catch (e) { /* privat modus o.l.: lyden starter av */ }
function lydCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!LYD.ctx) LYD.ctx = new AC();
  // Nettleserne starter lyd «suspended» til brukeren har rørt siden
  if (LYD.ctx.state === "suspended") LYD.ctx.resume();
  return LYD.ctx;
}
// Ett hammerslag på klokkeskåla: tre uharmoniske deltoner som dør ut,
// det som skiller en klokke fra en pipetone
function slag(t) {
  // Mens lyden er «suspended» står currentTime stille; slag planlagt da
  // ville stables på samme tidspunkt og smelle samtidig ved første
  // berøring. Ingenting køes før lyden faktisk går.
  if (!LYD.ctx || LYD.ctx.state !== "running") return;
  const c = LYD.ctx;
  const g = c.createGain();
  g.connect(c.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  [[1, 1], [2.76, .45], [5.4, .2]].forEach(([m, a]) => {
    const o = c.createOscillator(), og = c.createGain();
    o.frequency.value = 880 * m;
    og.gain.value = a;
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t + 0.24);
  });
}
const SLAGMS = 55;   // en elektrisk ringeklokke slår ~18 ganger i sekundet
function kanRinge() {
  return LYD.paa && !document.hidden &&
         !document.body.classList.contains("dod") && lydCtx();
}
function ringStart() {
  if (LYD.ring || !kanRinge()) return;
  LYD.ring = setInterval(() => slag(LYD.ctx.currentTime + 0.01), SLAGMS);
}
function ringStopp() {
  clearInterval(LYD.ring);
  LYD.ring = 0;
}
function stot() {                 // 300 ms, som avvist-støtet på klokken
  if (!kanRinge()) return;
  const t0 = LYD.ctx.currentTime + 0.01;
  for (let i = 0; i * SLAGMS < 300; i++) slag(t0 + i * SLAGMS / 1000);
}
function klokkeTilstand(pl, retained) {
  LYD.tilstand = pl;
  if (pl === "ringer") ringStart(); else ringStopp();
  // Et retained «stott» er et støt som var over for lenge siden (master
  // døde midt i det) — det skal ikke slås på nytt ved tilkobling
  if (pl === "stott" && !retained) stot();
}
function lydBryter() {
  LYD.paa = !LYD.paa;
  try { localStorage.setItem("nsi63-panel-lyd", LYD.paa ? "paa" : "av"); }
  catch (e) {}
  if (LYD.paa) {
    lydCtx();                     // klikket er brukerhandlingen som trengs
    if (LYD.tilstand === "ringer") ringStart();
  } else {
    ringStopp();
  }
  tegnKontroll();
}

// Skjermen. Wake Lock finnes bare i en SIKKER kontekst (https eller
// localhost); panelet serveres over http på anleggets lukkede nett, så
// der er den i praksis aldri tilgjengelig. Da sier linjen det, og et
// klikk forklarer hva som gjelder i stedet.
const VAAKEN = { stotte: "wakeLock" in navigator, lock: null };
async function vaaken() {
  if (!VAAKEN.stotte || VAAKEN.lock || document.hidden) return;
  try {
    VAAKEN.lock = await navigator.wakeLock.request("screen");
    VAAKEN.lock.addEventListener("release", () => {
      VAAKEN.lock = null;
      tegnKontroll();
    });
  } catch (e) { /* f.eks. strømsparing — prøves igjen ved neste trykk */ }
  tegnKontroll();
}
function vaakenHint() {
  const h = document.getElementById("kontroll-hint");
  if (!h) return;
  h.hidden = !h.hidden;
  h.textContent = "Nettleseren kan bare holde skjermen våken over " +
    "https, og panelet går over http på anleggets eget nett. Slå av " +
    "automatisk skjermlås i nettbrettets innstillinger mens panelet " +
    "er i bruk.";
}

// Instruksen: knappen vises bare når Pi-en har en (instruks.md)
let HAR_INSTRUKS = false;
fetch("/panel/instruks", { method: "HEAD" })
  .then(r => { HAR_INSTRUKS = r.ok; tegnKontroll(); })
  .catch(() => {});
function instruksApne() {
  const m = document.getElementById("instruks");
  const f = m.querySelector("iframe");
  if (!f.getAttribute("src")) f.setAttribute("src", "/panel/instruks");
  m.classList.add("apen");
}
function instruksLukk() {
  document.getElementById("instruks").classList.remove("apen");
}

function tegnKontroll() {
  const k = document.getElementById("kontroll");
  if (!k) return;
  const skjerm = !VAAKEN.stotte
    ? `<span class="klikk" onclick="vaakenHint()"
         title="Hvorfor?">skjermen kan sovne</span>`
    : VAAKEN.lock ? `skjermen holdes våken`
    : `<span class="klikk" onclick="vaaken()">hold skjermen våken</span>`;
  k.innerHTML = skjerm +
    `<button onclick="lydBryter()" title="Klokkens lyd på dette ` +
    `nettbrettet (huskes)">Lyd: ${LYD.paa ? "på" : "av"}</button>` +
    (HAR_INSTRUKS
      ? `<button onclick="instruksApne()">Instruks</button>` : ``);
}

// Første berøring låser opp lyden og ber om å holde skjermen våken —
// begge krever en brukerhandling i nettleserne
document.addEventListener("pointerdown", () => {
  if (LYD.paa) lydCtx();
  vaaken();
}, { once: true });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { ringStopp(); return; }
  if (LYD.tilstand === "ringer") ringStart();
  vaaken();                       // låsen slippes når fanen skjules
});

/* ---------- MQTT ---------- */
const klient = mqtt.connect("ws://" + location.hostname + ":9001",
                            { reconnectPeriod: 2000, keepalive: 20 });
klient.on("connect", () => {
  dod(false);
  klient.subscribe(ROT + "#");
});
["close", "offline", "error"].forEach(e => klient.on(e, () => dod(true)));
// Ingen «tilkoblet»-linje: at forbindelsen er oppe sier siden selv
// ved å vise noe i det hele tatt. Det er det MOTSATTE som må ropes
// ut, og det gjør FRAKOBLET-overlegget.
function dod(erDod) {
  document.body.classList.toggle("dod", erDod);
  // En klokke som ringer videre på en død forbindelse lyver: master
  // kan for lengst ha stoppet den
  if (erDod) ringStopp();
}
function pub(tema, pl) { klient.publish(ROT + tema, String(pl)); }

klient.on("message", (tema, rå, pakke) => {
  tema = tema.slice(ROT.length);
  const pl = rå.toString();
  if (tema === "master/klokke/state")
    klokkeTilstand(pl, !!(pakke && pakke.retain));
  if (tema === "config/hal")        { K.hal = trygJson(pl); bygg(); return; }
  if (tema === "config/forrigling") { K.fr = trygJson(pl); bygg(); return; }
  if (tema === "config/anlegg")     { K.anlegg = trygJson(pl); titt(); return; }
  TIL[tema] = pl;
  (BIND[tema] || []).forEach(f => f(pl));
  if (tema.endsWith("/info") || tema === "master/melding") logg(tema, pl);
  if (tema === "master/status") mstat(pl);
});
function trygJson(s) { try { return JSON.parse(s); } catch (e) { return null; } }
function titt() {
  // Stasjonsnavnet fra konfigen, slik det står over apparatet.
  // Panelet fabrikkerer aldri navn selv: mangler navnet, viser vi
  // anleggs-IDen, og mangler den også, står det ingenting.
  const a = K.anlegg || {};
  const navn = (a.navn || a.id || "").trim();
  document.getElementById("tittel").textContent = navn;
  // Nabostasjonene er ren skilting. Står navnet tomt, skjules HELE
  // enden — en pil uten stasjon å peke på sier ingenting.
  for (const [id, navn] of [["nabo-v", a.nabo_venstre],
                            ["nabo-h", a.nabo_hoyre]]) {
    const el = document.getElementById(id);
    const n = (navn || "").trim();
    el.querySelector(".navn").textContent = n;
    el.hidden = !n;
  }
  document.title = navn ? navn + " — stillerapparat"
                        : "NSI63 — stillerapparat";
}
function mstat(s) {
  if (s !== "online") logg("master/status", s);
}

/* ---------- logg (nederst) ---------- */
const LOGG = [];
function logg(tema, pl) {
  const t = new Date();
  const ts = String(t.getHours()).padStart(2, "0") + ":" +
             String(t.getMinutes()).padStart(2, "0") + ":" +
             String(t.getSeconds()).padStart(2, "0");
  LOGG.push(ts + "  " + tema + "  " + pl);
  if (LOGG.length > 8) LOGG.shift();
  const el = document.getElementById("logg");
  if (el) el.textContent = LOGG.join("\n");
}

/* ---------- bygging fra konfig ---------- */
function bygg() {
  if (!K.hal || !K.fr) return;
  bygget = true;
  for (const k in BIND) delete BIND[k];
  const fns = K.hal.functions || [];
  const st = K.hal.signaltyper || {};
  const klasse = t => (st[t] && st[t].klasse) ||
    (String(t).startsWith("hovedsignal") ? "hovedsignal"
     : String(t).startsWith("forsignal") ? "forsignal"
     : String(t).startsWith("skiftesignal") ? "skiftesignal"
     : String(t).startsWith("dvergsignal") ? "dvergsignal" : null);
  const nr = (type, bilde) =>
    (st[type] && st[type].signalnr && st[type].signalnr[bilde])
      ? st[type].signalnr[bilde] + " " : "";

  // Bare det tekstflaten under apparatet fortsatt trenger: sporfeltene
  // (simuleringsknappene) og to tellinger til loggen. Resten av
  // objektlistene forsvant med seksjonene de bygget.
  const veksler = fns.filter(f => erVeksel(f.type));
  const felt = fns.filter(f => f.type === "sporfelt");
  const togveier = (K.fr.togveier || []).map(tv => tv.id);

  let h = "";

  /* Sporplanen — milepæl 2-skjelettet: komposisjonsmotor + plass-
     holderblokker. Feiler komposisjonen, forsvinner bare planen —
     tekstflaten under er alltid komplett. */
  // Sporplanen står UTEN kort og overskrift. Den ER apparatet — en
  // ramme med tittel rundt gjør den til en illustrasjon i et
  // dashbord. Tabellene under beholder kortene sine; de er
  // betjening og skal se ut som det de er.
  h += `<div id="planholder"></div><div id="kontroll"></div>
    <div id="kontroll-hint" hidden></div>`;

  /* Sporfelt — visning + simulering (benketesting: uten sensorer er
     dette eneste måten å «kjøre tog» fra panelet, f.eks. for å nå
     klar-utlos i sistevognskontrollen) */
  h += `<section><h2>Sporfelt <span class="hint">simuleringsknappene
    overstyrer sensorene — «Sensor» gir dem tilbake</span></h2>`;
  for (const f of felt) {
    h += `<div class="rad"><span class="litra">${f.id}</span>
      <span class="hint" style="min-width:82px">${f.rolle || ""}</span>
      <span class="st" data-b="sporfelt/${f.id}/state">–</span>
      <button onclick="pub('sporfelt/${f.id}/sim','belagt')">Belagt</button>
      <button onclick="pub('sporfelt/${f.id}/sim','fri')">Fritt</button>
      <button onclick="pub('sporfelt/${f.id}/sim','av')"
        title="Slipp simuleringen — sensorene rår igjen">Sensor</button>
      </div>`;
    bindSt(`sporfelt/${f.id}/state`, v => v === "belagt" ? "roed" : "ledig");
  }
  h += `</section>`;

  /* Brytere */
  // Å legge om bryterne gjøres på apparatet — Sign.stp og Jord er
  // trykknapper der, Lok I og Lok II er stillere, og de går over /set
  // ved siden av de fysiske bryterne. «Fysisk» slipper en SIM (satt
  // fra benken eller mqtt-test), som ellers overstyrer begge.
  h += `<section><h2>Brytere
    <span class="hint">slipp simuleringen</span></h2>
    <div class="rad"><span class="litra">Sign.stp</span>
      <span class="st" data-b="master/signalstopp">–</span>
      <button onclick="pub('signalstopp/sim','auto')">Fysisk</button>
    </div>
    <div class="rad"><span class="litra">Lok v</span>
      <span class="st" data-b="master/frigivning" data-del="venstre">–</span>
      <button onclick="pub('frigivning/v/sim','auto')">Fysisk</button>
    </div>
    <div class="rad"><span class="litra">Lok h</span>
      <span class="st" data-b="master/frigivning" data-del="hoyre">–</span>
      <button onclick="pub('frigivning/h/sim','auto')">Fysisk</button>
    </div></section>`;
  bindSt("master/signalstopp", v => v === "paa" ? "roed" : "ledig");
  bind("master/frigivning", (v, el) => {
    const d = trygJson(v) || {};
    el.textContent = d[el.dataset.del] ? "frigitt" : "normal";
    el.className = "st " + (d[el.dataset.del] ? "varsel" : "ledig");
  });

  /* Hendelseslinje */
  /* «Lagre SVG» hører hjemme her nede blant tabellene, ikke over
     sporplanen: planen skal se ut som apparatet, og en knapp i
     overskriften røper at det er en nettside. */
  h += `<section><h2>Verktøy</h2>
    <div class="rad"><span class="litra">Sporplan</span>
      <button onclick="lagreSvg()"
        title="Last ned sporplanen som frittstående SVG-fil — alle lamper tent, skiltfonten innbakt">Lagre SVG</button>
    </div></section>`;

  h += `<section><h2>Siste meldinger</h2><div id="logg"></div>
    <p class="hint">Avvisninger begrunnes her og ved raden det
    gjelder. Full historikk: hendelsesloggen i HAL-UI-et.</p></section>`;

  document.getElementById("hoved").innerHTML = h;
  try {
    byggPlan(fns);
  } catch (e) {
    const ph = document.getElementById("planholder");
    if (ph) ph.innerHTML =
      `<span class="hint">sporplanen kunne ikke komponeres: ` +
      `${e.message} — tekstflaten under gjelder</span>`;
  }
  tegnKontroll();
  // Re-spill kjente tilstander inn i den nye flaten
  for (const tema in BIND)
    if (TIL[tema] !== undefined)
      BIND[tema].forEach(f => f(TIL[tema]));
  logg("panel", "konfig lastet — " + togveier.length + " togveier, " +
       veksler.length + " veksler");
}

/* bind: koble et tema til alle elementer med data-b=tema */
function bind(tema, fn) {
  (BIND[tema] = BIND[tema] || []).push(pl => {
    document.querySelectorAll(`[data-b="${tema}"]`)
      .forEach(el => fn(pl, el));
  });
}
function bindSt(tema, klasseAv) {   // enkel tekst + fargeklasse
  bind(tema, (pl, el) => {
    el.textContent = pl;
    el.className = "st " + (klasseAv(pl) || "");
  });
}
function bindInfo(tema) {
  bind(tema, (pl, el) => { el.textContent = pl; });
}

/* ==================== SPORPLANEN (milepæl 2-skjelett) ====================
   Plassholder-blokkbibliotek + komposisjonsmotor. Kontrakten mot
   Ferdig tegnede blokker:
   - SPOR-BLOKKER på fast modul 100×60 med sporlinjen i y=30 og
     inn/ut på modulkanten. Én blokk per ting; speiling gjør resten.
   - OVERLEGGS-BLOKKER (signaler, lås-symboler, tekst) ankres mot
     modulen med et punkt på sporlinjen og flippes over/under etter
     siden de skal stå på.
   - Lampelinser er egne elementer med klasse "pl" og BEGGE fargene
     sine i --pa/--av (se lampeStil i ui/signalfarger.js) — koden
     mørker (av), tenner (pa) og blinker (blink).
   Hver blokk er én funksjon i `pbl` som returnerer SVG-tekst; når
   kunstverkets SVG-er kommer, byttes funksjonens innmat blokk for
   blokk — komposisjonen og bindingene røres ikke. */
const MW = 100, MH = 52, SY = 30;   // modulmål og sporlinjens y
// (MH 60 -> 52 21.08.2026: tettere radavstand — 45°-geometrien
// følger med automatisk siden alle diagonalhopp bruker MH/MW)

const pbl = {
  linje: (x, y) => `<path class="plspor" d="M${x},${y+SY} H${x+MW}"/>`,
  linjeLampe: (x, y, id, farge) =>
    pbl.linje(x, y) +
    `<circle id="${id}" class="pl" style="${lampeStil(farge)}" ` +
    `cx="${x+50}" cy="${y+SY}" r="6"/>`,
  // Linjefelt-ende: sporet ut til kanten, feltlampe + blå togveislampe.
  // Litraen skrives PÅ sporbåndet ved siden av lampa (innsiden).
  ende: (x, y, side, idL, idTv, litra) => {
    const sp = side === "v"
      ? `M${x+MW},${y+SY} H${x+8}`
      : `M${x},${y+SY} H${x+MW-8}`;
    const lx = side === "v" ? x + 45 : x + 55;
    const txt = !litra ? ""
      : side === "v"
      ? `<text class="pltekst" x="${lx + 12}" y="${y+SY+4}">${litra}</text>`
      : `<text class="pltekst" text-anchor="end" x="${lx - 12}" ` +
        `y="${y+SY+4}">${litra}</text>`;
    return `<path class="plspor" d="${sp}"/>` +
      `<circle id="${idL}" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${lx}" cy="${y+SY}" r="6"/>` +
      `<circle id="${idTv}" class="pl" style="${lampeStil('#1f8fff')}" ` +
      `cx="${lx}" cy="${y+SY+16}" r="6"/>` + txt;
  },
  // Halsveksel: rett spor + avvik som diagonal til øvre modulhjørne
  // (mot stasjonsmidten). side='v': diagonal opp mot høyre; 'h': mot
  // venstre. Hjørne-til-hjørne-kontrakten gjør radskiftet sømløst.
  veksel: (x, y, side, litra) => {
    const d = side === "v"
      ? `M${x+30},${y+SY} L${x+MW},${y}` : `M${x+70},${y+SY} L${x},${y}`;
    const nx = side === "v" ? x + 15 : x + 85;
    const ax = side === "v" ? x + 62 : x + 38;
    return `<g class="plklikk" onclick="plVeksel('${litra}')">` +
      `<path class="plspor" d="M${x},${y+SY} H${x+MW}"/>` +
      `<path class="plspor" d="${d}"/>` +
      `<circle id="pl-vn-${litra}" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${nx}" cy="${y+SY}" r="6"/>` +
      `<circle id="pl-va-${litra}" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${ax}" cy="${y+SY-14}" r="6"/>` +
      `<text class="pltekst" x="${x+44}" y="${y+SY+18}">${litra}</text></g>`;
  },
  // Innføring: mottar halsvekselens diagonal i nedre hjørne og
  // legger den inn på radens sporlinje. side='v': fra nede-venstre.
  innf: (x, y, side) => {
    const d = side === "v"
      ? `M${x},${y+MH} L${x+50},${y+SY} H${x+MW}`
      : `M${x+MW},${y+MH} L${x+50},${y+SY} H${x}`;
    return `<path class="plspor" d="${d}"/>`;
  },
  // Stubbveksel: normal-stilling rett frem, avviket som kort grein
  // (opp/ned) til et buttspor utenfor planen. Gruppelås-objektene
  // (rigelveksler, S-lås-veksler) tegnes slik.
  stubb: (x, y, side, opp, litra) => {
    const gy = opp ? y + 6 : y + MH - 6;
    const gx = side === "h" ? x + 78 : x + 22;
    const fra = side === "h" ? x + 46 : x + 54;
    return `<g class="plklikk" onclick="plVeksel('${litra}')">` +
      `<path class="plspor" d="M${x},${y+SY} H${x+MW}"/>` +
      `<path class="plspor" d="M${fra},${y+SY} L${gx},${gy} ` +
      `m${side==="h"?-4:4},${opp?-3:3} l8,6"/>` +
      `<circle id="pl-vn-${litra}" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${x+(side==="h"?26:74)}" cy="${y+SY}" r="6"/>` +
      `<circle id="pl-va-${litra}" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${(fra+gx)/2}" cy="${(y+SY+gy)/2}" r="6"/>` +
      `<text class="pltekst" x="${x+44}" y="${y+SY+18}">${litra}</text></g>`;
  },
  // Sporsperre: strek VINKELRETT på sporbåndet den står over
  // (ux,uy = båndets retning; navnet bæres av rigel-etiketten)
  sperre: (px, py, id, ux = 1, uy = 0) => {
    const nx = -uy, ny = ux;   // normalen til båndet
    return `<g class="plklikk" onclick="plSperre('${id}')">` +
      `<path d="M${px - nx * 13},${py - ny * 13} ` +
      `L${px + nx * 13},${py + ny * 13}" fill="none" ` +
      `stroke="#33363a" stroke-width="7" stroke-linecap="butt"/>` +
      `<path d="M${px - nx * 12},${py - ny * 12} ` +
      `L${px + nx * 12},${py + ny * 12}" fill="none" ` +
      `stroke="#8d9094" stroke-width="5" stroke-linecap="butt"/></g>`;
  },
  // Hovedsignal (plassholder: rød + grønn linse), retn 'v' = vender
  // mot venstre (tog østfra). flipp = under sporet.
  // S-lås/nøkkelfelt: firkant med nøkkellampe (Nelaug: tent = nøkkel
  // i kontroll) + visningsnavn
  // rette hjørner, grått fyll som sporbåndet, 1 px omriss
  noekkelfelt: (px, py, id, navn) =>
    `<g><rect x="${px}" y="${py}" width="22" height="22" ` +
    `fill="#8d9094" stroke="#33363a" stroke-width="1"/>` +
    `<circle id="pl-sl-${id}" class="pl" style="${lampeStil('#ffb400')}" ` +
    `cx="${px+11}" cy="${py+11}" r="6"/>` +
    `<text class="plnavn" x="${px+27}" y="${py+15}">${navn}</text></g>`,
  // Rigel-etikett med kontrollampe (ved sperresymbolet, som fotoet)
  rigel: (px, py, id, navn) =>
    `<g><circle id="pl-ri-${id}" class="pl" style="${lampeStil('#ffb400')}" ` +
    `cx="${px}" cy="${py}" r="6"/>` +
    `<text class="plnavn" x="${px+9}" y="${py+4}">${navn}</text></g>`,
};

// LAGRE SOM SVG: frittstående fil av sporplanen med ALLE lamper
// tent (dokumentasjons-/printutgaven). Stilen bakes inn i fila
// (SVG-<style>), inkludert skiltfonten som data-URI, så fila står
// på egne ben i Inkscape/Illustrator/nettleser.
async function lagreSvg() {
  const kilde = document.getElementById("plansvg");
  if (!kilde) return;
  const kopi = kilde.cloneNode(true);
  let fontCss = "";
  try {
    const r = await fetch("/panel/routed-gothic.ttf");
    const buf = new Uint8Array(await r.arrayBuffer());
    let b = "";
    for (let i = 0; i < buf.length; i++) b += String.fromCharCode(buf[i]);
    fontCss = `@font-face{font-family:"Routed Gothic";` +
      `src:url(data:font/ttf;base64,${btoa(b)}) format("truetype");}`;
  } catch (e) { /* uten font: fallback gjelder */ }
  // Hammerlakkflisen bakes inn som data-URI: en eksportert fil skal
  // kunne åpnes hvor som helst, uten Pi-en i den andre enden.
  const bilde = kopi.querySelector("#pl-hammerlakk");
  try {
    // Adressen leses av elementet, ikke bygges på nytt — den bærer
    // flisas mål som versjonsnøkkel, og de skal stå ett sted.
    const r = await fetch(bilde.getAttribute("href"));
    const buf = new Uint8Array(await r.arrayBuffer());
    let b = "";
    for (let i = 0; i < buf.length; i++) b += String.fromCharCode(buf[i]);
    bilde.setAttribute("href", `data:image/png;base64,${btoa(b)}`);
  } catch (e) { /* uten flis: grunnfargen står igjen */ }
  const NS = "http://www.w3.org/2000/svg";
  const st = document.createElementNS(NS, "style");
  st.textContent = fontCss + `
    .pl { fill: var(--pa); stroke: #33363a; stroke-width: 1; }
    .plspor { stroke: #8d9094; stroke-width: 12; fill: none;
              stroke-linecap: butt; }
    .pltekst { fill: #111; font: 12px "Routed Gothic", sans-serif; }
    .plnavn { fill: #111; font: 11px "Routed Gothic", sans-serif; }
    .pltvs .knott { fill: #c9342a; stroke: #33363a; stroke-width: 1; }
    .plknapp .knhode { fill: #111; stroke: #33363a; stroke-width: 1; }
    .bsplate { fill: #f2efe4; stroke: #1c1e21; stroke-width: 1; }
    .ampskive { fill: #f2efe4; }
    .ampsort { fill: #14181c; }
    .amptekst { fill: #14181c; font-weight: 700;
                font-family: "Arial Narrow", "Helvetica Neue", sans-serif; }
    .bsskilt { fill: #111; font: 12px "Routed Gothic", sans-serif;
               text-anchor: middle; }
    .plskille { fill: #111; }`;
  const vb = kopi.viewBox.baseVal;
  const bg = document.createElementNS(NS, "rect");
  bg.setAttribute("x", vb.x); bg.setAttribute("y", vb.y);
  bg.setAttribute("width", vb.width); bg.setAttribute("height", vb.height);
  bg.setAttribute("fill", "#fff");
  kopi.insertBefore(bg, kopi.firstChild);
  kopi.insertBefore(st, bg);
  const xml = new XMLSerializer().serializeToString(kopi);
  const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + xml],
                        { type: "image/svg+xml" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const id = (K.anlegg && K.anlegg.id) || "anlegg";
  a.download = `nsi63-${id}-stillerapparat.svg`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function plSet(id, mode) {   // "pa" | "av" | "blink"
  const el = document.getElementById(id);
  if (!el || !el.classList) return;
  el.classList.remove("pa", "blink");
  if (mode !== "av") el.classList.add(mode);
}
function planBind(tema, fn) { (BIND[tema] = BIND[tema] || []).push(fn); }
// Felles blinktakt: 60 blink/min, lys:mørke 1:1 — én klokke for hele
// planen, forankret i veggklokka så fasen er lik i alle nettlesere
setInterval(() => document.body.classList.toggle(
  "blinkfase", Math.floor(Date.now() / 500) % 2 === 0), 250);
function plVeksel(litra) {   // klikk: legg om (master forrigler)
  const naa = TIL[`sporveksel/${litra}/state`];
  pub(`sporveksel/${litra}/set`, naa === "avvik" ? "normal" : "avvik");
}
function plSperre(id) {
  const naa = TIL[`sporsperre/${id}/state`];
  pub(`sporsperre/${id}/set`, naa === "avlagt" ? "paalagt" : "avlagt");
}
// TOGVEISTILLER-DYTT: som på apparatet — stilleren dyttes mot den
// enden togbevegelsen skal (master parer linjefelt- og spordytt
// innen 2 s). Knotten fjærer visuelt tilbake.
function plDytt(litra, r) {
  pub(`stiller/${litra}/lagt`, r);
  const g = document.getElementById(`pl-tvs-${litra}`);
  const k = g && g.querySelector(".knott");
  if (k) {
    k.setAttribute("transform",
                   `translate(${r === "v" ? -BSUTSLAG : BSUTSLAG},0)`);
    setTimeout(() => k.removeAttribute("transform"), 250);
  }
}
// SORT TRYKKNAPP (meldeknappen) ved linjefeltet: kvitterer
// varselklokka for tog i anmarsj (varselfelt/<litra>/kvitter) og
// utfører sistevognskvitteringen for innkjørtogvei over dette
// linjefeltet som står i klar-utlos. Panelet er dumt: hvilke
// varselfelt og togveier knappen omfatter, ble utledet av konfig da
// planen ble bygget (PLK), og master avviser det som ikke passer.
const PLK = {};
function plKnapp(lf) {
  const d = PLK[lf] || { vf: [], tv: [] };
  for (const v of d.vf) pub(`varselfelt/${v}/kvitter`, "");
  for (const id of d.tv)
    if (TIL[`togvei/${id}/state`] === "klar-utlos")
      pub(`togvei/${id}/set`, "kvitter");
  const g = document.getElementById(`pl-kn-${lf}`);
  const k = g && g.querySelector(".knhode");
  if (k) {
    k.setAttribute("r", BSKNAPP - BSKNAPPINN);
    setTimeout(() => k.setAttribute("r", BSKNAPP), 150);
  }
}
// BETJENINGSFELTET (den grønne flaten under transparenten) — de
// stående stillerne følges av tilstand (bsSett), de tilbakefjærende
// fjærer visuelt. Fargene er dagens regelverk (ORV kap. 3.3).
// «I normalstilling står stilleren rett ut fra stillerapparatet»
// (ORV 3.3.3, 3.3.4, 3.3.8, 3.3.9). Den legges 45° NED for å
// aktivere — skifting tillatt, lås frigitt, Lok-frigivning på — og
// blir liggende der til den legges tilbake.
//
// Vekselstilleren er unntaket som bekrefter regelen: den kan legges
// opp ELLER ned, men fjærer tilbake til midten (se bsDytt).
// STILLERNE SOM BLIR STÅENDE (skift, lok, samlelås, rigel) styres av
// tilstanden fra anlegget, ikke av trykket. Det er riktig — det er
// anlegget som avgjør — men det gjorde at et AVVIST forsøk ikke ga
// noe utslag i det hele tatt: stilleren rørte seg ikke, og operatøren
// satt igjen uten å vite om ordren var mottatt eller ignorert.
//
// Nå legges stilleren om med én gang og går tilbake hvis anlegget
// ikke bekrefter innen fristen. Det er den mekaniske stilleren
// oversatt: hånda legger den om, og fjærer den tilbake når
// forriglingen nekter.
//
// bsSist er hvor anlegget SIST sa stilleren står — dit den faller
// tilbake. bsVent er vakthunden som venter på bekreftelse.
const bsSist = {}, bsVent = {};

function bsStill(k, ned) {
  if (ned) k.setAttribute("transform", `translate(0,${BSUTSLAG})`);
  else k.removeAttribute("transform");
}

function bsSett(slag, id, aktiv) {
  const k = document.getElementById(`bs-kn-${slag}-${id}`);
  if (!k) return;
  const n = `${slag}-${id}`;
  bsSist[n] = aktiv;              // anlegget har talt: dette er fasit
  clearTimeout(bsVent[n]);        // bekreftet, vakthunden kan hvile
  delete bsVent[n];
  bsStill(k, aktiv);
}

// Legg om nå, og la den fjære tilbake om ingen bekreftelse kommer.
function bsProv(slag, id, ned) {
  const k = document.getElementById(`bs-kn-${slag}-${id}`);
  if (!k) return;
  const n = `${slag}-${id}`;
  bsStill(k, ned);
  clearTimeout(bsVent[n]);
  bsVent[n] = setTimeout(() => {
    delete bsVent[n];
    bsStill(k, !!bsSist[n]);
  }, BSVENTSTART);
}
function bsDytt(slag, id, retn) {
  const opp = retn === "opp";
  if (slag === "veksel") {
    // Sporvekselstilleren er den ENESTE som kan legges begge veier:
    // «De kan legges 45° opp eller ned og går automatisk tilbake til
    // normalstilling når de slippes» (ORV 3.3.4). Fjæren er selve
    // betjeningsmåten — «sporvekselstilleren holdes omlagt inntil
    // amperemeteret gjør utslag».
    //
    // Retningen er IKKE fast: den følger sporplanen. Går avviksgreina
    // oppover i tegningen, legges stilleren opp for avvik; går den
    // nedover, legges den ned. Skiltene over og under viser det
    // samme, og begge deler kommer fra VAVVIKOPP.
    const avvikOpp = VAVVIKOPP[id] !== false;
    pub(`sporveksel/${id}/set`, (opp === avvikOpp) ? "avvik" : "normal");
    const k = document.getElementById(`bs-kn-veksel-${id}`);
    if (k) {
      k.setAttribute("transform", `translate(0,${opp ? -BSUTSLAG : BSUTSLAG})`);
      bsVekselHold(id);
    }
  } else if (slag === "skift") {
    bsProv(slag, id, !opp);
    // Skiftesignalstiller (rød): «Stilleren kan bare legges 45° ned,
    // og blir liggende omlagt inntil den legges tilbake» — nede viser
    // signalet «Skifting tillatt» (ORV 3.3.3).
    pub(`skiftesignal/${id}/set`, opp ? "slukket" : "skifting-tillatt");
  } else if (slag === "samlelaas" || slag === "rigel") {
    bsProv(slag, id, !opp);
    // Frigiverstiller (blå): «Frigivingen skjer ved at stilleren
    // legges 45° ned» (ORV 3.3.9).
    pub(`${slag}/${id}/set`, opp ? "sperr" : "frigi");
  } else if (slag === "gg") {
    bsProv(slag, id, !opp);
    // Gjennomgangsdrift (hvit): legges 45° ned for på, rett ut for av.
    // En bryter TIL ved siden av en eventuell fysisk, som signalstoppen.
    pub("gjennomgang/set", opp ? "av" : "paa");
  } else if (slag === "lok") {
    bsProv(slag, id, !opp);
    // Lok-frigivning (gul): «Frigiving skjer ved at stillerne legges
    // 45° ned» (ORV 3.3.8). /set er panelets egen bryter, ELLER-et med
    // den fysiske; /sim er benkens og overstyrer begge.
    pub(`frigivning/${id}/set`, opp ? "av" : "paa");
  }
}
// VEKSELSTILLEREN BLIR LIGGENDE til drivmaskinen er ferdig, ikke i
// et fast antall millisekunder: «sporvekselstilleren holdes omlagt
// inntil amperemeteret gjør utslag» (ORV 3.3.4). Hånda slipper når
// maskinen har gjort sitt, og det er nettopp det tilstanden forteller.
//
// id -> { sett: har vi sett «omlegging» ennå, vakt: timeout }
const VSPAK = {};

function bsVekselFrist() {
  // Samme frist som master gir drivmaskinen, pluss litt for
  // meldingsvei. Tidslåsene er konfigurerbare, så den leses – den
  // skal ikke stå to steder.
  const v = Number(((K.anlegg || {}).tider || {}).veksel_timeout_ms);
  return (Number.isFinite(v) && v > 0 ? v : 5000) + 500;
}

function bsVekselHold(id) {
  // Vakthunden er ikke pynt. Blir omleggingen avvist av forriglingen,
  // eller står vekselen allerede der den ble kommandert, kommer det
  // ingen ny tilstand — og uten den ville stilleren blitt stående
  // omlagt for godt.
  const h = VSPAK[id];
  if (h) clearTimeout(h.vakt);
  VSPAK[id] = { sett: false,
                vakt: setTimeout(() => bsVekselSlipp(id), BSVENTSTART) };
}

function bsVekselSlipp(id) {
  const h = VSPAK[id];
  if (!h) return;
  clearTimeout(h.vakt);
  delete VSPAK[id];
  const k = document.getElementById(`bs-kn-veksel-${id}`);
  if (k) k.removeAttribute("transform");
}

function bsVekselTilstand(id, pl) {
  const h = VSPAK[id];
  if (!h) return;                 // ingen stiller står omlagt
  if (pl !== "omlegging") { bsVekselSlipp(id); return; }
  // Maskinen gikk i gang. Nå gjelder den lange fristen — helt til
  // vekselen melder en annen tilstand, eller master gir opp.
  h.sett = true;
  clearTimeout(h.vakt);
  h.vakt = setTimeout(() => bsVekselSlipp(id), bsVekselFrist());
}

// VISEREN BEVEGER SEG SOM EN VISER. Et dreiespoleinstrument har
// masse og fjær: nåla kastes forbi utslaget og faller tilbake før den
// blir stående. En CSS-overgang gir en jevn oppbremsing UTEN
// oversving, og det leser som av og på — teknisk sett en animasjon,
// men ikke en bevegelse.
//
// Her regnes stillingen ut hvert bilde som et dempet fjærsystem:
//   akselerasjon = AMPK * (mål - vinkel) - AMPD * fart
// Lett underdempet, så det blir ett tydelig oversving og ro etter et
// drøyt halvsekund — som nåla på et instrument som får strøm.
// Hvilestillingen er slik viseren er tegnet, oppe til venstre. Derfra
// til motsatt ytterstilling er det 92 grader. En drivmaskin som går
// slår ikke måleren i bunn, så utslaget stopper før enden.
//
// De står HER, ikke inne i bygg(): ampSteg er en global funksjon og
// trenger AMPFULLT til anslagene.
const AMPFULLT = 92, AMPUTSLAG = 74;
const AMPK = 190, AMPD = 17;
// STARTSTRØMMEN. En drivmaskin trekker mye mer i det den setter seg i
// bevegelse enn når den går: rotoren står stille, og strømmen er bare
// begrenset av viklingsmotstanden. Måleren slås i bunn et øyeblikk og
// legger seg så ned på gangstrømmen. Uten dette står viseren rolig på
// ett tall så lenge maskinen går, og det er ikke det man ser.
const AMPSTART = AMPFULLT, AMPSTARTMS = 220;
let ampVinkel = 0, ampFart = 0, ampMaal = 0, ampSist = 0, ampGaarNaa = false;
let ampGangTimer = 0;

function ampNullstill() {   // ny tegning: nåla står i ro på null
  clearTimeout(ampGangTimer); ampGangTimer = 0;
  ampVinkel = ampFart = ampMaal = 0;
  ampGaarNaa = false;
}

function ampSteg(naa) {
  // Taket på dt: står fanen i bakgrunnen, kommer det ett bilde etter
  // mange sekunder, og uten taket ville nåla fått et digert sprang.
  const dt = Math.min((naa - ampSist) / 1000, 0.05);
  ampSist = naa;
  ampFart += (AMPK * (ampMaal - ampVinkel) - AMPD * ampFart) * dt;
  ampVinkel += ampFart * dt;
  // ANSLAGENE. Et instrument har en stopper i hver ende: nåla hviler
  // mot den ved null og kan ikke svinge forbi fullt utslag. Uten dem
  // dro oversvingen nåla 4,4 grader UNDER null når strømmen falt —
  // ut av skalaen, der den på et virkelig instrument ville ligget an
  // mot pinnen. Stopperen tar farten; den spretter ikke.
  if (ampVinkel < 0) { ampVinkel = 0; if (ampFart < 0) ampFart = 0; }
  else if (ampVinkel > AMPFULLT) {
    ampVinkel = AMPFULLT; if (ampFart > 0) ampFart = 0;
  }
  const g = document.getElementById("pl-amp");
  if (!g) { ampGaarNaa = false; return; }     // tegningen bygget om
  // I ro: legg fra oss målet nøyaktig og slutt å tegne. Panelet står
  // på en Pi, og en viser som ikke rører seg skal ikke koste strøm.
  if (Math.abs(ampMaal - ampVinkel) < 0.05 && Math.abs(ampFart) < 0.5) {
    ampVinkel = ampMaal; ampFart = 0; ampGaarNaa = false;
    g.setAttribute("transform", `rotate(${ampMaal})`);
    return;
  }
  g.setAttribute("transform", `rotate(${ampVinkel.toFixed(2)})`);
  requestAnimationFrame(ampSteg);
}

function ampVekk() {            // sett løkka i gang om den sover
  if (ampGaarNaa) return;
  ampGaarNaa = true;
  ampSist = performance.now();
  requestAnimationFrame(ampSteg);
}

// paa = trekker en drivmaskin strøm nå?
function ampSett(paa) {
  clearTimeout(ampGangTimer); ampGangTimer = 0;
  if (!paa) {
    ampMaal = 0;
  } else {
    // Startstrøm først, så gangstrøm. Setter en maskin til seg i
    // gang mens den første går, begynner støtet på nytt — det er
    // riktig, det er en ny rotor som står stille.
    ampMaal = AMPSTART;
    ampGangTimer = setTimeout(() => {
      ampGangTimer = 0; ampMaal = AMPUTSLAG; ampVekk();
    }, AMPSTARTMS);
  }
  ampVekk();
}

function bsKnappTrykk(navn) {
  const k = document.getElementById(`bs-knapp-${navn}`);
  if (k) {
    k.setAttribute("r", BSKNAPP - BSKNAPPINN);
    setTimeout(() => k.setAttribute("r", BSKNAPP), 150);
  }
}
function bsJord() {          // sort trykknapp: kvitter jordfeil
  pub("jord/set", "trykk");
  bsKnappTrykk("jord");
}
function bsStopp() {         // rød trykknapp: signalstopp inn/ut
  // Vekslingen følger masterens tilstand. Står en FYSISK signalstopp
  // på, sender trykket «av» — og den fysiske holder den på, som den
  // skal: panelet er en bryter til, ikke en overstyring.
  pub("signalstopp/set",
      TIL["master/signalstopp"] === "paa" ? "av" : "paa");
  bsKnappTrykk("stopp");
}

function byggPlan(fns) {
  const holder = document.getElementById("planholder");
  if (!holder) return;
  // Visningsnavn ALLTID fra konfig: navn-feltet der det er satt
  // (forsignalenes «A½», låsenes «S.LÅS I»), ellers litraen — panelet
  // fabrikkerer aldri navn selv
  const vn = f => f.navn || f.id;
  const tvs = (K.fr && K.fr.togveier) || [];
  const feltAv = {};
  fns.filter(f => f.type === "sporfelt").forEach(f => feltAv[f.id] = f);
  const lfs = fns.filter(f => f.type === "sporfelt" &&
                              f.rolle === "linjefelt");
  const lfV = lfs.find(f => f.side === "v");
  const lfH = lfs.find(f => f.side === "h");
  const togspor = [...new Set(tvs.map(t => t.spor).filter(Boolean))];
  if (!lfV || !lfH || !togspor.length)
    throw new Error("krever linjefelt med side v og h + togveier " +
                    "med spor");
  const altN = s => tvs.filter(t => t.spor === s)
      .every(t => (t.sporveksler || []).every(v => v.stilling === "normal"));
  togspor.sort((a, b) => (altN(b) ? 1 : 0) - (altN(a) ? 1 : 0) ||
                         String(a).localeCompare(String(b)));
  const lfFor = t => (t.frie || []).find(x => feltAv[x] &&
                                              feltAv[x].rolle === "linjefelt");
  /* ---- portgrafen: vekslene med spiss/pluss/minus/stamme ---- */
  const ref = v => !v ? null
    : String(v).startsWith("veksel ") ? { veksel: String(v).slice(7) }
    : { spor: String(v) };
  const vx = {};
  for (const f of fns)
    if (erVeksel(f.type))
      vx[f.id] = { spiss: f.spiss || null, pluss: ref(f.pluss_til),
                   minus: ref(f.minus_til), stamme: ref(f.spiss_til),
                   avvikBen: f.avvik_ben || null, pos: null };
  // Togvei-avledningen (som før): hals = avviksbruk mot rad>0,
  // row0-røtter = hals + normal-bruk på hovedsporet
  const rowOf = {};
  rowOf[togspor[0]] = 0;
  if (togspor[1] !== undefined) rowOf[togspor[1]] = 1;
  const hals = { v: null, h: null };
  const bruk = {};
  for (const t of tvs) {
    const side = lfFor(t) ? feltAv[lfFor(t)].side : null;
    for (const v of (t.sporveksler || [])) {
      const e = bruk[v.sporveksel] = (bruk[v.sporveksel] ||
                                      { avvik: null, normal: null });
      if (v.stilling === "avvik") e.avvik = { spor: t.spor, side };
      else if (!e.normal) e.normal = { spor: t.spor, side };
    }
  }
  for (const [litra, e] of Object.entries(bruk))
    if (e.avvik && e.avvik.side && rowOf[e.avvik.spor] > 0)
      hals[e.avvik.side] = litra;
  // Kjedemedlemmer: veksler noen peker på via pluss/minus/stamme
  // (stamme-referanser er BAK-lenker — veksel 7 peker tilbake på
  // veksel 3 — og skal ikke diskvalifisere rota)
  const iKjede = new Set();
  for (const v of Object.values(vx))
    for (const p of [v.pluss, v.minus])
      if (p && p.veksel) iKjede.add(p.veksel);
  // row0-røtter på hver side, utover mot enden: hals ytterst.
  //
  // En rot er en veksel INGEN peker på, som ligger i hovedsporet.
  // Kilden er tegnefeltene: plussgreina lander i et togspor på rad 0,
  // og spissen sier hvilken stasjonsende den hører til.
  //
  // Togveitabellen er nødhjelp for konfiger uten utfylte tegnefelt —
  // og den er en felle, av samme grunn som «kyss»-nødhjelpen lenger
  // nede: da de håndstilte vekslene ble flyttet ut av togveiene og
  // over i låsekravet, sluttet Sokna veksel 3 å være en rot. Den ble
  // aldri plassert, og med den forsvant veksel 7 og sidesporene 4 og
  // 5 fra planen — uten et ord.
  const rot = { v: [], h: [] };
  const leggRot = (side, litra) => {
    if (side !== "v" && side !== "h") return;
    if (litra === hals.v || litra === hals.h) return;
    if (iKjede.has(litra)) return;
    if (rot.v.includes(litra) || rot.h.includes(litra)) return;
    rot[side].push(litra);
  };
  for (const [litra, v] of Object.entries(vx)) {
    const sp = v.pluss && v.pluss.spor;
    if (sp && rowOf[sp] === 0) leggRot(v.spiss, litra);
  }
  for (const [litra, e] of Object.entries(bruk))
    if (e.normal && rowOf[e.normal.spor] === 0)
      leggRot(e.normal.side, litra);
  /* ---- posisjoner (rad, x i modulenheter) ---- */
  // Vestkjeden legges først (x fra 2 og østover), så østsiden.
  const settPos = (l, rad, x) => { if (vx[l]) vx[l].pos = { rad, x }; };
  const sporKnute = {};   // sporlitra -> [{rad,x}] (koblingspunkter)
  const leggSporPkt = (s, rad, x, dir) => {
    (sporKnute[s] = sporKnute[s] || []).push({ rad, x, dir });
    if (rowOf[s] === undefined) rowOf[s] = rad;
  };
  const kanter = [];      // {fra:{rad,x}, til:{rad,x}, veksel, port}
  function gaaKjede(rotLitra, rad0, x0) {
    const rotV = vx[rotLitra];
    if (!rotV) return;
    settPos(rotLitra, rad0, x0);
    const xdir = rotV.spiss === "h" ? -1 : 1;
    // retning opp/ned: kjeden går OPP hvis den når et spor med kjent
    // rad over seg (typisk 02); ellers ned (sørkomplekset)
    let treffOpp = false;
    let f = rotV.minus && rotV.minus.veksel;
    const sett = new Set([rotLitra]);
    while (f && vx[f] && !sett.has(f)) {
      sett.add(f);
      const pv = (vx[f].pluss && vx[f].pluss.spor) ||
                 (bruk[f] && bruk[f].normal && bruk[f].normal.spor);
      if (pv && rowOf[pv] > 0) treffOpp = true;
      f = vx[f].minus && vx[f].minus.veksel;
    }
    const dir = treffOpp ? 1 : (rad0 === 0 ? -1 : 1);
    let cur = rotLitra, rad = rad0, x = x0;
    let neste = rotV.minus && rotV.minus.veksel;
    const gaatt = new Set([rotLitra]);
    while (neste && vx[neste] && !gaatt.has(neste)) {
      gaatt.add(neste);
      const nv = vx[neste];
      // Sporet plussgreina lander på. FASITEN er vekselens eget
      // «pluss_til» — togveitabellen er bare en nødhjelp for konfiger
      // der tegnefeltet aldri ble fylt ut.
      //
      // Nødhjelpen er en felle: den holdt spor 02 på Sokna oppe helt
      // til de håndstilte vekslene ble flyttet ut av togveiene og over
      // i låsekravet. Da forsvant «bruk», veksel 5 sto uten pluss_til,
      // og 02 ble tegnet som en stubb med litra, lamper og
      // togveistiller oppå hverandre. HAL-UI advarer nå om togspor med
      // bare én veksel i endene — men kilden skal være tegnefeltet.
      const kyss = (nv.pluss && nv.pluss.spor) ||
                   (bruk[neste] && bruk[neste].normal &&
                    bruk[neste].normal.spor) || null;
      let nrad = rad + dir;
      // snapp til kjent rad hvis kyss-sporet alt er plassert
      if (kyss && rowOf[kyss] !== undefined) nrad = rowOf[kyss];
      // 45°-GEOMETRI: et radskifte flytter x med MH/MW per rad, så
      // hele vekselgata ligger på ÉN rett 45°-linje (ingen trappetrinn).
      // MEN: peker NESTE vekselens stamme TILBAKE på forrige (som
      // veksel 9 mot 5), ligger vekselen i sin EGEN vannrette
      // sporrekke — gata bøyer av 45° og går vannrett inn i den
      // (full kolonne, kantbanen får knekken automatisk).
      // UNNTAK avvik_ben="pluss" (veksel 7): det krumme benet er
      // pluss-greina, stamme og minus ligger i linje — gata
      // fortsetter rett gjennom vekselen på 45°-linja.
      // Og BARE når vekselen har en fortsettelse (minus) trengs
      // innløpet — uten fortsettelse (Grindvoll veksel 5) treffer
      // diagonalen sporet i selve vekselpunktet, så skjøten er
      // synlig der vekselen er merket.
      // (avvik_ben «spiss» — greinene i linje — trenger heller ikke
      // innløp: vekselen ligger i grein-raden med stubben forbi seg)
      const stammeTilbake = nv.stamme && nv.stamme.veksel === cur &&
                            !nv.avvikBen && !!nv.minus;
      let nx = x + xdir * (nrad === rad || stammeTilbake
        ? 1 : Math.abs(nrad - rad) * (MH / MW));
      if (nv.pos) { nrad = nv.pos.rad; nx = nv.pos.x; }
      kanter.push({ fra: { rad, x }, til: { rad: nrad, x: nx },
                    veksel: cur, port: "minus" });
      if (!nv.pos) settPos(neste, nrad, nx);
      rad = nrad; x = nx;
      // pluss-greina KYSSER på vekselens egen rad
      if (kyss) leggSporPkt(kyss, rad, x);
      cur = neste;
      neste = nv.minus && nv.minus.veksel;
    }
    // Kjedens siste ledd: minus mot et SPOR lander én rad utover —
    // MED MINDRE stammen er det fysisk krumme benet (avvik_ben=
    // «spiss», som veksel 11): da ligger pluss- og minusgreina i
    // LINJE, og sporet fortsetter på vekselens egen rad.
    const siste = vx[cur];
    if (siste && siste.minus && siste.minus.spor) {
      const s = siste.minus.spor;
      const iLinje = siste.avvikBen === "spiss";
      const nrad = (rowOf[s] !== undefined) ? rowOf[s]
                 : (iLinje ? rad : rad + dir);
      // i linje: minus-sporet lander på MOTSATT side av pluss-greina
      // (kyss-sporet) — Grindvoll veksel 5: sidesporet vest, stubben
      // øst. Fallback: kjederetningen (Sokna 11: spor 3 mot øst).
      let retn = xdir;
      if (iLinje && siste.pluss && siste.pluss.spor &&
          sporKnute[siste.pluss.spor]) {
        const andre = sporKnute[siste.pluss.spor]
          .map(p => p.x).filter(x2 => x2 !== x);
        if (andre.length) retn = Math.min(...andre) < x ? 1 : -1;
      }
      const nx = x + retn * (nrad === rad
        ? 1 : Math.abs(nrad - rad) * (MH / MW));   // 45°-geometri
      kanter.push({ fra: { rad, x }, til: { rad: nrad, x: nx },
                    veksel: cur, port: "minus" });
      leggSporPkt(s, nrad, nx, retn);
    }
  }
  // grunnlinjens kolonner: [ende][linjefelt][kjederøtter ... midt]
  const cV = 2;
  gaaKjede(hals.v || rot.v[0], 0, cV);
  rot.v.forEach((l, i) => { if (l !== (hals.v || rot.v[0]))
    settPos(l, 0, cV + 1 + i); });
  // østsiden: regn ut nødvendig bredde av vestkjeden først
  let maksX = cV;
  for (const v of Object.values(vx))
    if (v.pos) maksX = Math.max(maksX, v.pos.x);
  for (const pkt of Object.values(sporKnute))
    for (const p of pkt) maksX = Math.max(maksX, p.x);
  const cH = Math.max(maksX + 4, 8);
  gaaKjede(hals.h || rot.h[0], 0, cH);
  rot.h.forEach((l, i) => { if (l !== (hals.h || rot.h[0])) {
    settPos(l, 0, cH - 1 - i);
    gaaKjede(l, 0, cH - 1 - i);
  }});
  // stamme-lenker (f.eks. veksel 9 -> veksel 5): tegn som kant
  for (const [litra, v] of Object.entries(vx)) {
    if (!v.pos || !v.stamme || !v.stamme.veksel) continue;
    const m = vx[v.stamme.veksel];
    if (m && m.pos &&
        !kanter.some(k => (k.veksel === litra || k.veksel === v.stamme.veksel) &&
          ((k.fra.rad === v.pos.rad && k.fra.x === v.pos.x &&
            k.til.rad === m.pos.rad && k.til.x === m.pos.x) ||
           (k.til.rad === v.pos.rad && k.til.x === v.pos.x &&
            k.fra.rad === m.pos.rad && k.fra.x === m.pos.x))))
      kanter.push({ fra: { rad: v.pos.rad, x: v.pos.x },
                    til: { rad: m.pos.rad, x: m.pos.x },
                    veksel: litra, port: "stamme" });
  }
  /* ---- geometri ---- */
  // Avstanden fra ytterste sporveksel til ytterkanten skal være LIK
  // på begge sider: vest = cV moduler + KANT, øst = (nCol-cH) moduler
  // + KANT => nCol = cH + cV. KANT gir romsligere sider.
  const nCol = cH + cV;
  const KANT = 200;
  let minRad = 0, maksRad = 1;
  for (const r of Object.values(rowOf)) {
    minRad = Math.min(minRad, r); maksRad = Math.max(maksRad, r);
  }
  for (const v of Object.values(vx)) if (v.pos) {
    minRad = Math.min(minRad, v.pos.rad);
    maksRad = Math.max(maksRad, v.pos.rad);
  }
  // Hvit marg over og under sporplanen.
  //
  // Toppen er ren luft: det eneste som stikker opp over øverste rad er
  // sporets litra, 27 px over sporlinjen, og maksRad er alltid minst 1
  // — signalmastene over hovedsporet rekker aldri opp i margen.
  //
  // Bunnen er IKKE ren luft når hovedsporet er nederste rad: da henger
  // mastene for vestgående signaler, togveilampen og den sorte
  // trykknappen ned i den, 63 px under sporlinjen. Ligger det sidespor
  // under (Sokna: spor 4 og 5), står de samme mastene inne i planen og
  // margen kan være like smal som toppen.
  const topp = 23;
  const bunn = minRad === 0 ? 46 : 23;
  const W = nCol * MW, H = topp + (maksRad - minRad + 1) * MH + bunn;
  const Y = rad => topp + (maksRad - rad) * MH + SY;
  const X = c => c * MW;
  const P = (rad, x) => [X(x), Y(rad)];
  let s = "";
  // SKILLE mellom sporfelt i forriglingen: svart tverrstrek som
  // holder seg INNENFOR linjebåndet (grå bredde 12). Markeres der
  // linjefelt/togspor grenser mot vekselfelt og rundt varselfeltene;
  // der vekselfelt grenser mot annet enn linjefelt/togspor markeres
  // ingenting.
  const skille = (x, rad = 0) => `<rect class="plskille" ` +
    `x="${x - 3.5}" y="${Y(rad) - 6}" width="7" height="12"/>`;
  // Fast kort avstand veksel->skille, med plass til tungekontroll-
  // lampa (22 fra vekselpunktet + linse 6 + luft). I TUNGEENDEN
  // ligger skillet visuelt tettere på (der er det ingen lampe —
  // kontrollampene sitter alltid på greinsiden).
  const SKAVST = 40, SKTETT = 22;
  // Linjefeltets ytre skille: LFUT fra modulnettkanten — plassen er
  // tatt fra det ulitrerte feltet mellom varselfelt og linjefelt.
  // UTEN varselfelt (fjernstyrt strekning, Grindvoll) finnes verken
  // varselfelt eller ulitrert felt: linjefeltet utvides utover
  // (LFUTB) og siden får bredere kant, så stillerkolonnen (stiller,
  // blå lampe, sort knapp) går klar av mastene uten sideflytting
  const LFUT = 60, LFUTB = 150;
  const lfHarVarsel = {};
  for (const v of fns)
    if (v.type === "sporfelt" && v.rolle === "varselfelt" &&
        v.linjefelt)
      lfHarVarsel[v.linjefelt] = true;
  const lfUtFor = id => lfHarVarsel[id] ? LFUT : LFUTB;
  const kantV = lfV && !lfHarVarsel[lfV.id] ? KANT + 90 : KANT;
  const kantH = lfH && !lfHarVarsel[lfH.id] ? KANT + 90 : KANT;
  const skAvst = (litra, skilleVestForVeksel) => {
    const sp = (vx[litra] || {}).spiss;
    return (skilleVestForVeksel ? sp === "v" : sp === "h")
      ? SKTETT : SKAVST;
  };
  // Sentralstilte veksler = i togveier og IKKE omfattet av lås/rigel;
  // det er DE som avgrenser vekselfeltene. Håndveksler med lås ligger
  // inne i togsporfeltene (på Sokna: 01 går helt til veksel 1, forbi
  // veksel 3).
  const iLaas = new Set();
  for (const f of fns)
    if (f.type === "samlelaas" || f.type === "rigel")
      (f.omfatter || []).forEach(o => iLaas.add(String(o)));
  const vSentral = {};
  for (const l of Object.keys(vx))
    vSentral[l] = !!bruk[l] && !iLaas.has(l);
  // grenseveksel for et felt på rad: nærmeste SENTRALSTILTE veksel
  // på den siden av midten (håndveksler bare som nødfall)
  const grenseV = (rad, midt0, side) => {
    const kand = Object.entries(vx).filter(([l, v]) =>
      v.pos && v.pos.rad === rad &&
      (side === "v" ? v.pos.x <= midt0 : v.pos.x > midt0));
    const sen = kand.filter(([l]) => vSentral[l]);
    const pool = sen.length ? sen : kand;
    if (!pool.length) return null;
    pool.sort((a, b) => side === "v"
      ? b[1].pos.x - a[1].pos.x : a[1].pos.x - b[1].pos.x);
    return pool[0][0];
  };
  /* hovedsporet (rad 0): ett sammenhengende bånd kant til kant */
  s += `<path class="plspor" d="M${-kantV},${Y(0)} H${X(1)}"/>` +
       `<path class="plspor" d="M${X(nCol - 1)},${Y(0)} ` +
       `H${nCol * MW + kantH}"/>`;
  s += `<path class="plspor" d="M${X(1)},${Y(0)} H${X(nCol - 1)}"/>`;
  // STILLERMERKING (apparatets «A/L … B/M»): for hvert objekt med
  // togveistiller samles startsignalene etter BEVEGELSESRETNING —
  // vestover (innkjør fra h-linja, utkjør mot v-linja) til venstre
  // for knotten, østover til høyre. Utledet av togveitabellen +
  // signalrollene, som alt annet.
  const hovedRolle = {};
  for (const f of fns)
    if (String(f.type).startsWith("hovedsignal"))
      hovedRolle[f.id] = f.rolle || "";
  const stillerTekster = obj => {
    const v2 = [], h2 = [];
    for (const t of tvs) {
      if (t.spor !== obj && lfFor(t) !== obj) continue;
      const lf = lfFor(t);
      const side = lf ? (feltAv[lf] || {}).side : null;
      if (!side || !t.start) continue;
      const inn = hovedRolle[t.start] === "innkjor";
      const vest = inn ? side === "h" : side === "v";
      const m2 = vest ? v2 : h2;
      if (!m2.includes(t.start)) m2.push(t.start);
    }
    return [v2.join("/"), h2.join("/")];
  };
  // Togveistilleren: rød knott med klikkbare halvdeler (dytt v/h)
  // og retningsmerking på hver side
  const stillerSym = (litra, xm, yv) => {
    const [vT, hT] = stillerTekster(litra);
    // Samme spor og samme utslag som stillerne i betjeningsfeltet,
    // bare lagt vannrett: dette ER samme slags stiller, den ligger
    // bare på planen og legges til sidene i stedet for ned.
    const ytre = BSUTSLAG + BSKNOTT;
    return `<g class="pltvs" id="pl-tvs-${litra}">` +
      bsSpor(xm, yv, true) +
      `<rect x="${xm - ytre}" y="${yv - 14}" width="${ytre}" height="28" ` +
      `fill="transparent" onclick="plDytt('${litra}','v')"/>` +
      `<rect x="${xm}" y="${yv - 14}" width="${ytre}" height="28" ` +
      `fill="transparent" onclick="plDytt('${litra}','h')"/>` +
      `<circle class="knott" cx="${xm}" cy="${yv}" r="${BSKNOTT}" ` +
      `pointer-events="none"/>` +
      // Merkingen OVER båndet, ikke ved siden av stilleren: sporet
      // opptar nå bredden der den lå, og lenger ut kolliderer den med
      // feltlitraene. Over båndet er den fri, og den står fortsatt
      // ved sin egen side av stilleren.
      (vT ? `<text class="plnavn" text-anchor="end" ` +
            `pointer-events="none" x="${xm - 6}" y="${yv - 12}">` +
            `${vT}</text>` : "") +
      (hT ? `<text class="plnavn" pointer-events="none" ` +
            `x="${xm + 6}" y="${yv - 12}">${hT}</text>` : "") +
      `</g>`;
  };
  // LINJEFELTENE tegnes som togsporene: to lamper med litra på
  // båndet (22 % inn fra hver feltgrense), togveistilleren SENTRERT
  // på feltet, blå togveilampe rett under stilleren, og skiller mot
  // det ulitrerte feltet utenfor og vekselfeltet innenfor
  const knapper = [];  // sorte trykknapper — tegnes etter mastene
  const tegnLinjefelt = (f, side) => {
    const yv = Y(0);
    const base = side === "v" ? X(0) : nCol * MW;
    const d = side === "v" ? 1 : -1;      // +1 = innover mot øst
    const o = base - d * lfUtFor(f.id);   // ytre skille (mot ulitrert)
    // indre skille mot vekselfeltet: fast avstand fra halsvekselen —
    // TETT i tungeenden (og der er begge halsvekslenes tunger)
    const i = side === "v"
      ? X(cV) - skAvst(hals.v || "", true)
      : X(cH) + skAvst(hals.h || "", false);
    const xu = o + (i - o) * 0.22, xi = i - (i - o) * 0.22;
    const xm = (o + i) / 2;
    const t = (x, mot) => mot > 0
      ? `<text class="pltekst" x="${x + 12}" y="${yv + 4}">${vn(f)}</text>`
      : `<text class="pltekst" text-anchor="end" x="${x - 12}" ` +
        `y="${yv + 4}">${vn(f)}</text>`;
    // hva den sorte knappen ved DETTE linjefeltet omfatter — utledet
    // av konfig: feltets varselfelt + togveiene som går over feltet
    PLK[f.id] = {
      vf: fns.filter(v => v.type === "sporfelt" &&
                          v.rolle === "varselfelt" &&
                          v.linjefelt === f.id).map(v => v.id),
      tv: tvs.filter(t2 => lfFor(t2) === f.id).map(t2 => t2.id)
    };
    // togveilampe og sort trykknapp tegnes ETTER mastene
    // (kollisjonssjekk mot dem) — her noteres bare ønsket plass
    knapper.push({ lf: f.id, xm, o, i, linjeblokk: !!f.linjeblokk });
    return `<circle id="pl-fl-${f.id}" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${xu}" cy="${yv}" r="6"/>` + t(xu, d) +
      `<circle id="pl-fl-${f.id}-b" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${xi}" cy="${yv}" r="6"/>` + t(xi, -d) +
      stillerSym(f.id, xm, yv) +
      // (blå togveilampe + sort trykknapp tegnes ETTER mastene, i
      // kolonne under stilleren, med kollisjonsflytting — se knapper)
      skille(o) + skille(i);
  };
  s += tegnLinjefelt(lfV, "v") + tegnLinjefelt(lfH, "h");
  // TOGSPOR: to sporfeltlamper (én mot hver ende) med litraen skrevet
  // PÅ sporfeltet ved siden av lampa, og togveistilleren midt på
  // sporet (symbol nå — dyttgesten kommer i milepæl 3).
  // Lamper og stillere står LIKT plassert i x-retningen på alle
  // togspor: plasseringen bestemmes av det korteste togsporets frie
  // strekning (mellom innerste veksel på hver side av midten).
  const friAv = (x1, x2, rad) => {
    const midt0 = (x1 + x2) / 2;
    let cx1 = x1, cx2 = x2;
    for (const v of Object.values(vx)) {
      if (!v.pos || v.pos.rad !== rad) continue;
      if (v.pos.x <= midt0) cx1 = Math.max(cx1, v.pos.x);
      else cx2 = Math.min(cx2, v.pos.x);
    }
    if (cx2 - cx1 < 2) { cx1 = x1; cx2 = x2; }   // nødfall
    return [cx1, cx2];
  };
  const tsSpenn = sid => {
    if (sporKnute[sid]) {
      const xs = sporKnute[sid].map(p => p.x);
      return [Math.min(...xs), Math.max(...xs)];
    }
    return [1, nCol - 1];              // hovedsporet (rad 0)
  };
  // Felles mal = SNITTET av togsporenes friområder (= det korteste,
  // og garantert innenfor alle båndene)
  let tvFri = null;
  for (const sid of togspor) {
    const [x1, x2] = tsSpenn(sid);
    const f = friAv(x1, x2, rowOf[sid]);
    tvFri = tvFri
      ? [Math.max(tvFri[0], f[0]), Math.min(tvFri[1], f[1])] : f;
  }
  // Lampene og togveistilleren står MIDT PÅ SIDEN — samme loddrette
  // linje som signalstopplampa og amperemeteret nede på
  // betjeningsfeltet (begge på W/2). Før sto de midt på sporets frie
  // strekning, og den er sjelden midt på siden: på Sokna 24 piksler
  // til venstre. Da mistet apparatet den ene linja som binder
  // sporplanen og betjeningsfeltet sammen.
  //
  // Faller midtlinja utenfor den frie strekningen — et anlegg der
  // stasjonen ligger skjevt i planen — går vi tilbake til
  // strekningens egen midte. Heller usentrert enn oppå en veksel.
  const tvFriA = X(tvFri[0]), tvFriB = X(tvFri[1]);
  const tvRom = Math.min(W / 2 - tvFriA, tvFriB - W / 2);
  const tvPaaMidten = tvRom > 0;
  const tvXm = tvPaaMidten ? W / 2 : (tvFriA + tvFriB) / 2;
  // Lampene sto 22 % inn fra hver ende, altså 0,56 av halvbredden fra
  // midten. Regnet fra den TRANGESTE halvdelen blir de liggende
  // innenfor båndet på begge sider, også når midtlinja ligger utenfor
  // strekningens egen midte.
  const tvHalv = (tvPaaMidten ? tvRom : (tvFriB - tvFriA) / 2) * 0.56;
  const tvXa = tvXm - tvHalv, tvXb = tvXm + tvHalv;
  const tegnTogspor = (sid, rad) => {
    const yv = Y(rad);
    const xa = tvXa, xb = tvXb, xm = tvXm;
    // skiller mot vekselfeltene: togsporfeltet går HELT TIL
    // grensevekselen (nærmeste sentralstilte — forbi låste
    // håndveksler), fast avstand fra vekselpunktet, tett i tungeenden
    const [sp1, sp2] = tsSpenn(sid);
    const m0 = (sp1 + sp2) / 2;
    const gV = grenseV(rad, m0, "v"), gH = grenseV(rad, m0, "h");
    return (gV ? skille(X(vx[gV].pos.x) + skAvst(gV, false), rad) : "") +
      (gH ? skille(X(vx[gH].pos.x) - skAvst(gH, true), rad) : "") +
      `<circle id="pl-fl-${sid}" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${xa}" cy="${yv}" r="6"/>` +
      `<text class="pltekst" x="${xa + 12}" y="${yv + 4}">${sid}</text>` +
      `<circle id="pl-fl-${sid}-b" class="pl" style="${lampeStil('#ffb400')}" ` +
      `cx="${xb}" cy="${yv}" r="6"/>` +
      `<text class="pltekst" text-anchor="end" x="${xb - 12}" ` +
      `y="${yv + 4}">${sid}</text>` +
      stillerSym(sid, xm, yv);
  };
  s += tegnTogspor(togspor[0], 0);
  /* spor med koblingspunkter: spenn mellom punktene, butt = forleng
     mot venstre (Sokna-konvensjonen; alle buttsporene peker vest) */
  for (const [sid, pkt] of Object.entries(sporKnute)) {
    const rad = rowOf[sid];
    const xs = pkt.map(p => p.x);
    let x1 = Math.min(...xs), x2 = Math.max(...xs);
    if (x1 === x2) {
      // buttspor: forleng BORT fra vekselen — retningen fra
      // landingspunktet om den er kjent, ellers vestover
      // (Sokna-konvensjonen)
      if ((pkt[0].dir || -1) > 0) x2 = x2 + 2;
      else x1 = x1 - 2;
    }
    s += `<path class="plspor" d="M${X(x1)},${Y(rad)} H${X(x2)}"/>`;
    if (togspor.includes(sid)) {
      s += tegnTogspor(sid, rad);
      continue;
    }
    const harLampe = (feltAv[sid] || {}).rolle !== "spor";
    if (harLampe)
      s += `<circle id="pl-fl-${sid}" class="pl" style="${lampeStil('#ffb400')}" ` +
        `cx="${X((x1 + x2) / 2)}" cy="${Y(rad)}" r="6"/>`;
    // spornummer SENTRERT på sporet i x-retningen, over båndet
    s += `<text class="pltekst" text-anchor="middle" ` +
      `x="${X((x1 + x2) / 2)}" y="${Y(rad) - 12}">${sid}</text>`;
  }
  /* kantene (diagonalene) */
  // Diagonalene tegnes i 45°: skrå del først (ut fra vekselpunktet),
  // deretter vannrett inn mot målet — som forbildet
  for (const k of kanter) {
    const [ax, ay] = P(k.fra.rad, k.fra.x);
    const [bx, by] = P(k.til.rad, k.til.x);
    const dx = bx - ax, dy = by - ay;
    if (dy === 0 || Math.abs(dx) <= Math.abs(dy)) {
      s += `<path class="plspor" d="M${ax},${ay} L${bx},${by}"/>`;
    } else {
      const mx = ax + Math.sign(dx) * Math.abs(dy);
      s += `<path class="plspor" d="M${ax},${ay} L${mx},${by} H${bx}"/>`;
    }
  }
  /* vekslene: klikkflate + kontrollamper lagt langs greinretningene */
  const vSens = {};   // litra -> har stillingssensorer
  const vFeltAv = {}; // litra -> sporvekselfeltet (for belagt-lampa)
  const kantFra = {};
  for (const k of kanter) {
    (kantFra[k.veksel] = kantFra[k.veksel] || []).push(k);
  }
  // VEKSELNUMRENE skal aldri overlappe sporbånd: for hver veksel
  // noteres hvilke KVADRANTER (over/under x vest/øst) som er opptatt
  // av skrå kanter, og litraen legges i første ledige. Rene
  // 45°-kanter opptar kvadranten i BEGGE ender; knekk-kanter
  // (45° + vannrett innløp) bare i fra-enden — innløpet er vannrett.
  const posAv = {};
  for (const [l, v] of Object.entries(vx))
    if (v.pos) posAv[v.pos.rad + "|" + v.pos.x] = l;
  const vKvad = {};
  const blokk = (l, qx, qy) => { if (l)
    (vKvad[l] = vKvad[l] || new Set()).add(qx + "," + qy); };
  for (const k of kanter) {
    const [ax, ay] = P(k.fra.rad, k.fra.x);
    const [bx, by] = P(k.til.rad, k.til.x);
    const dx = bx - ax, dy = by - ay;
    if (dy === 0) continue;
    const sx = Math.sign(dx), sy = Math.sign(dy);
    blokk(posAv[k.fra.rad + "|" + k.fra.x], sx, sy);
    if (Math.abs(dx) <= Math.abs(dy))
      blokk(posAv[k.til.rad + "|" + k.til.x], -sx, -sy);
  }
  for (const [litra, v] of Object.entries(vx)) {
    if (!v.pos) continue;
    const [px, py] = P(v.pos.rad, v.pos.x);
    // retningsvektor for lampene: mot pluss (langs raden) og mot
    // minus (langs første kant fra vekselen)
    const pd = (v.spiss === "h") ? -1 : 1;
    let mx = pd * 0.5, my = -0.5;
    const ke = (kantFra[litra] || [])[0];
    if (ke) {
      const [tx, ty] = P(ke.til.rad, ke.til.x);
      const dx = tx - px, dy = ty - py;
      if (dy !== 0 && Math.abs(dx) > Math.abs(dy)) {
        // 45°-kant: lampa legges langs den skrå delen
        mx = Math.sign(dx) * Math.SQRT1_2;
        my = Math.sign(dy) * Math.SQRT1_2;
      } else {
        const ln = Math.hypot(dx, dy) || 1;
        mx = dx / ln; my = dy / ln;
      }
    }
    // Tungekontrollamper fantes BARE på vekslene som kan styres
    // elektrisk fra stillerapparatet (Sokna: veksel 1 og 2) — de
    // sentralstilte, eller veksler med drivutganger i konfig. Uten
    // kontroll er lampene bare SLUKKET (aldri blink). Håndveksler
    // har ingen lamper — forbildet hadde ingen sensorer på dem:
    // sikringsanlegget forholder seg bare til NØKLENES status.
    const vf = fns.find(f => f.id === litra && erVeksel(f.type));
    const harSens = vf && (vf.bindinger || []).some(b =>
      b.sted === "sensor-normal" || b.sted === "sensor-avvik");
    const harDriv = vf && (vf.bindinger || []).some(b =>
      b.sted === "ut-normal" || b.sted === "ut-avvik");
    vSens[litra] = !!harSens;
    let lamper = ``;
    if (vSentral[litra] || harDriv) {
      // Sporvekselfeltets FELTLAMPE: feltet utledes som i master —
      // utløsningsfeltet til togveiene som bruker vekselen. Lampa
      // oppfører seg som alle andre sporfeltlamper (gul, lyser når
      // feltet er FRITT, slukker ved belegg) og står sentrert i x
      // der linjene skiller lag (vekselpunktet).
      for (const t of tvs)
        if ((t.sporveksler || []).some(v => v.sporveksel === litra) &&
            t.utlosningsfelt) { vFeltAv[litra] = t.utlosningsfelt; break; }
      lamper =
        `<circle id="pl-vn-${litra}" class="pl" style="${lampeStil('#ffb400')}" ` +
        `cx="${px + pd * 22}" cy="${py}" r="6"/>` +
        `<circle id="pl-va-${litra}" class="pl" style="${lampeStil('#ffb400')}" ` +
        `cx="${px + mx * 26}" cy="${py + my * 26}" r="6"/>` +
        (vFeltAv[litra]
          ? `<circle id="pl-vfb-${litra}" class="pl" ` +
            `style="${lampeStil('#ffb400')}" cx="${px}" cy="${py}" r="6"/>`
